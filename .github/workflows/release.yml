# The release pipeline: pushing a version tag produces every release artifact
# and its checksums, with nothing built by hand. Builds run here rather than
# on any one machine because the Apple artifacts cannot be produced anywhere
# else we control - that was the milestone's hard blocker the moment there is
# one Apple user.
#
# Four rows, all of them static, and that uniformity is what AYEAYE-101 bought:
#
#   x86_64/aarch64-unknown-linux-musl   static, via cargo-zigbuild.
#   x86_64/aarch64-apple-darwin         the host toolchain, no features.
#
# There is no NVIDIA row any more, and no feature column. Inference moved behind
# `llama-swap`, so this binary compiles no kernels, links no CUDA runtime and
# has no acceleration to be built for — which deleted the one row that was
# glibc-dynamic rather than static musl, the CUDA devel container it needed, the
# `CUDA_COMPUTE_CAP` guess it needed, and `scripts/package-cuda.sh`. Whatever
# card is in the machine is llama-swap's business now, and it is built for it.
#
# Every artifact is published under a versioned name and a versionless alias,
# so releases/latest/download/<alias> fetches the newest release without first
# asking an API what "latest" is. SHA256SUMS covers every published name.
#
# The publish job converges rather than insists: if the local `cook publish`
# already created the release (it uploads the stamped tarball), the workflow
# adds the binaries to it and re-uploads byte-identical files - the tarball is
# reproducible from the tag commit, which is what makes the overlap safe.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Nothing builds until every version claim in the tree agrees with the tag,
  # the suite passes, and the linter passes as an error gate.
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: every version claim agrees with the tag
        run: bash scripts/check-release-version.sh "$GITHUB_REF_NAME"
      - name: rust suite
        run: cargo test --workspace --locked
      - name: linter, as an error gate
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: installer fallback
        run: sh tests/install.sh

  build:
    needs: verify
    strategy:
      # A red tag should show every broken row, not just the first one.
      fail-fast: false
      matrix:
        include:
          # The zigbuild container ships rust, zig and cargo-zigbuild
          # together; installing cargo-zigbuild from PyPI on the host looks
          # simpler and is not, because pipx isolates the ziglang dependency
          # from the interpreter cargo-zigbuild would find it with.
          - row: x86_64-unknown-linux-musl
            target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            kind: zigbuild
            container: ghcr.io/rust-cross/cargo-zigbuild:0.23.0
          - row: aarch64-unknown-linux-musl
            target: aarch64-unknown-linux-musl
            os: ubuntu-24.04
            kind: zigbuild
            container: ghcr.io/rust-cross/cargo-zigbuild:0.23.0
          - row: x86_64-apple-darwin
            target: x86_64-apple-darwin
            os: macos-14
            kind: host
          - row: aarch64-apple-darwin
            target: aarch64-apple-darwin
            os: macos-14
            kind: host
    runs-on: ${{ matrix.os }}
    # Empty for the Apple rows, which run on the runner itself.
    container: ${{ matrix.container || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: target
        run: rustup target add "${{ matrix.target }}"
      - name: build
        # `set -eu`, not `-o pipefail`: there is no pipe here, and not every
        # container's /bin/sh has a pipefail to set.
        run: |
          set -eu
          cmd=build
          [ "${{ matrix.kind }}" = zigbuild ] && cmd=zigbuild
          cargo "$cmd" --release --locked -p ayeaye --target "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.row }}
          path: target/${{ matrix.target }}/release/ayeaye
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: rows
      - name: both names for every artifact, and the tarball
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          mkdir -p dist
          # One directory per matrix row, named by the row - iterating what
          # was actually built means a new matrix row cannot be silently left
          # unpublished by a list that lagged it.
          rows=0
          for dir in rows/*/; do
            row="$(basename "$dir")"
            # The versioned name, and the versionless alias that lets
            # releases/latest/download fetch the newest without an API call.
            # Portable assets are bare executables; the CUDA row is a
            # self-contained runtime bundle. The installer knows the one
            # exceptional row and grants the executable bit after extraction.
            cp "$dir/ayeaye" "dist/ayeaye-$tag-$row"
            cp "$dir/ayeaye" "dist/ayeaye-$row"
            rows=$((rows + 1))
          done
          [ "$rows" -gt 0 ] || { echo "no build artifacts arrived" >&2; exit 1; }
          # The source tarball is a release artifact too, byte-reproducible
          # from the tag commit - which is why rebuilding it here cannot
          # disagree with a tarball the local flow already stamped.
          bash scripts/release-archive.sh "dist/ayeaye-$tag.tar.gz"
          cp "dist/ayeaye-$tag.tar.gz" "dist/ayeaye.tar.gz"
      - name: the tarball is installable
        run: bash scripts/check-release-artifact.sh "dist/ayeaye-$GITHUB_REF_NAME.tar.gz"
      - name: checksums over every published name
        run: |
          set -euo pipefail
          bash scripts/release-checksums.sh dist/ayeaye-* dist/ayeaye.tar.gz dist/SHA256SUMS
      - name: publish
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --title "ayeaye $tag" \
              --notes "Four portable binaries, one self-contained CUDA bundle, and the source tarball, each under a versioned name and a versionless alias, all covered by SHA256SUMS. The newest release is always at releases/latest/download/<alias>, no API call required."
          else
            # The local flow may already have uploaded the tarball whose
            # checksum is stamped into install.sh on main. Ours is rebuilt
            # from the same commit and should be byte-identical; if it is not
            # (a gzip that drifted, say), clobbering it would break the
            # bootstrap's strongest check on every stranger's machine - so
            # refuse loudly instead of converging onto a lie.
            existing="$(mktemp -d)"
            if gh release download "$tag" --pattern "ayeaye-$tag.tar.gz" --dir "$existing" 2>/dev/null; then
              theirs="$(sha256sum < "$existing/ayeaye-$tag.tar.gz" | cut -d' ' -f1)"
              ours="$(sha256sum < "dist/ayeaye-$tag.tar.gz" | cut -d' ' -f1)"
              if [ "$theirs" != "$ours" ]; then
                echo "refusing to clobber ayeaye-$tag.tar.gz: the release carries $theirs, this rebuild is $ours" >&2
                exit 1
              fi
            fi
          fi
          gh release upload "$tag" dist/* --clobber
