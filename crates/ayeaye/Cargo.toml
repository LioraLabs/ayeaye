[package]
name = "ayeaye"
description = "The ayeaye daemon: one portable binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
cuda = ["ayeaye-infer/cuda"]
metal = ["ayeaye-infer/metal"]

[dependencies]
ayeaye-core.workspace = true
ayeaye-infer.workspace = true

# axum and tokio are declared here rather than in [workspace.dependencies]:
# the root manifest is the file every ticket in this milestone touches, and
# nothing else in the workspace needs a server.
#
# Async because server-sent events are the app's interactive centrepiece and
# the only maintained blocking Rust server cannot flush mid-body. It stops
# here: ayeaye-core is synchronous, and the constitution's effect budget
# refuses `tokio` inside it.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
# The query string is percent-encoded and `+` means space; parse_qs gives the
# daemon that for free and hand-rolling it is where a `next=%2F%2Fevil` slips
# past a check that only looked at the raw text.
form_urlencoded = "1"
# `SC_CLK_TCK` is the unit /proc counts a process's start in, and no file on
# the machine says what it is. One sysconf call, in the one crate allowed to
# make it; the constitution refuses libc inside ayeaye-core.
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
