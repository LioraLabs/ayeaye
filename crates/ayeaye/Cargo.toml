[package]
name = "ayeaye"
description = "The ayeaye daemon: one portable binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
cuda = ["ayeaye-infer/cuda"]
metal = ["ayeaye-infer/metal"]

[dependencies]
ayeaye-core.workspace = true
ayeaye-infer.workspace = true

# axum and tokio are declared here rather than in [workspace.dependencies]:
# the root manifest is the file every ticket in this milestone touches, and
# nothing else in the workspace needs a server.
#
# Async because server-sent events are the app's interactive centrepiece and
# the only maintained blocking Rust server cannot flush mid-body. It stops
# here: ayeaye-core is synchronous, and the constitution's effect budget
# refuses `tokio` inside it.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
# `process` and `time`: the standard library has no wait-with-timeout, and a
# request that waits forever on a wedged tmux or cliban is the broken panel
# AYEAYE-43 and AYEAYE-53 both exist to avoid. `sync` for the async mutex that
# holds a fit lease across the tmux restore it awaits.
tokio = { version = "1", features = ["rt-multi-thread", "net", "process", "time", "sync"] }
# The query string is percent-encoded and `+` means space; parse_qs gives the
# daemon that for free and hand-rolling it is where a `next=%2F%2Fevil` slips
# past a check that only looked at the raw text.
form_urlencoded = "1"
# `SC_CLK_TCK` is the unit /proc counts a process's start in, and no file on
# the machine says what it is. One sysconf call, in the one crate allowed to
# make it; the constitution refuses libc inside ayeaye-core.
libc = "0.2"
# macOS keeps a process information structure the kernel fills in, and its
# start-time field is an instant. The alternative is `ps -o lstart=`, which
# prints a local wall-clock string that can only be read back through the
# machine's timezone - which the pure core may not do. Six of the seven
# questions could come from here; only this one does, because the other five
# have captured output that a test on this machine can be held to.
sysinfo = { version = "0.36", default-features = false, features = ["system"] }
# The resize body `share/app.html` sends, which cannot be changed. Read here in
# the shell rather than in the core: `ayeaye-core` declares no dependencies, and
# the hand-rolled scanner it does carry answers only the two questions cliban's
# output poses. A serde-shaped reader is the thing that would put a dependency
# on the allowlist, which is why this sits on this side of the line.
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "time"] }
