# The waiver ratchet — the duplication the tree already had when the tier-2
# rules landed (AYEAYE-64), each entry with the reason it may persist.
#
# This list only shrinks. A waiver whose violation is gone is itself a
# violation, and so is an entry with a blank justification or a key listed
# twice. New duplication gets no entry here without the same argument these
# carry: say why the copy is the design, or fix it instead.
#
#   cargo run -p constitution --example ratchet
#
# prints every unwaived finding as a paste-ready skeleton, and every problem
# with this file as a comment. The non-empty list is also the gate's canary:
# if the scanner ever goes blind, every entry here goes stale at once and the
# gate fails loudly instead of passing silently.

# --- the asset list: the core routes by name, the shell embeds by name -----
# route.rs maps URLs to asset file names; assets.rs pairs the same names with
# include_bytes!. Predates the gate. The real fix is one asset manifest the
# shell derives its embed table from, not deleting either side's spelling.

[[waiver]]
key = 'duplicate-literal/"app.html"/ayeaye+ayeaye-core'
justification = "the core's route table and the shell's include_bytes! table both name the file; one asset manifest is the real fix, and it predates the gate"

[[waiver]]
key = 'duplicate-literal/"board.html"/ayeaye+ayeaye-core'
justification = "same shape as app.html: route table and embed table each name the file"

[[waiver]]
key = 'duplicate-literal/"favicon.ico"/ayeaye+ayeaye-core'
justification = "same shape as app.html: route table and embed table each name the file"

