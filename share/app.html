<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16161e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>Aye, Aye</title>
<style>
  :root{
    --bg0:#16161e; --bg1:#1a1b26;
    --panel:#24273a; --panel2:#1e2030; --well:#181926;
    --line:#2c2f44; --line2:#3b3f58;
    --fg:#cad3f5; --muted:#8087a2; --faint:#5b6078;
    --green:#a6da95; --orange:#f5a97f; --yellow:#eed49f;
    --red:#ed8796; --blue:#8aadf4; --mauve:#c6a0f6;
    --r-s:8px; --r-m:12px; --r-l:16px;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,
           "Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,
           "Liberation Mono",monospace;
    --ease:cubic-bezier(.3,.7,.4,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important}
  }
  #ov,#out,#tx{scrollbar-width:none}
  #ov::-webkit-scrollbar,#out::-webkit-scrollbar,#tx::-webkit-scrollbar{display:none}
  body{
    margin:0;color:var(--fg);
    background:linear-gradient(180deg,var(--bg1) 0%,var(--bg0) 45%) fixed var(--bg0);
    font:15px/1.5 var(--sans);
    display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right)
            env(safe-area-inset-bottom) env(safe-area-inset-left);
    overscroll-behavior:none;
    -webkit-font-smoothing:antialiased;
  }
  /* Phone-shaped app, phone-shaped column: on a desktop the remote stays a
     centered strip instead of stretching buttons across the whole window. */
  @media (min-width: 700px){
    body{max-width:520px;margin:0 auto;
         border-left:1px solid var(--line);border-right:1px solid var(--line)}
  }
  button{font:inherit;color:inherit;cursor:pointer}
  button:active{transform:scale(.97)}
  button{transition:background .15s var(--ease),border-color .15s var(--ease),
                    color .15s var(--ease),transform .1s var(--ease),
                    opacity .15s var(--ease)}

  /* ---- header ------------------------------------------------------------ */
  header{
    display:flex;align-items:center;gap:10px;padding:10px 14px;flex:none;
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:8px;min-width:0}
  .brand img{flex:none;display:block;opacity:.92}
  .brand b{font-size:15px;font-weight:650;letter-spacing:.01em;
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #conn{
    display:inline-flex;align-items:center;gap:6px;flex:none;
    font-size:11px;font-weight:550;letter-spacing:.02em;color:var(--muted);
    border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 8px;
    background:var(--panel2);
    transition:color .2s var(--ease),border-color .2s var(--ease);
  }
  #conn.ok{color:var(--green);border-color:rgba(166,218,149,.28)}
  #conn.off{color:var(--red);border-color:rgba(237,135,150,.3)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);
       transition:background .2s var(--ease),box-shadow .2s var(--ease)}
  .dot.live{background:var(--green);box-shadow:0 0 6px rgba(166,218,149,.55)}
  #conn.off .dot{background:var(--red)}
  .spacer{flex:1}
  .seg{
    display:flex;flex:none;background:var(--panel2);border:1px solid var(--line);
    border-radius:10px;padding:2px;gap:2px;
  }
  .seg a{
    padding:5px 12px;border-radius:8px;font-size:12px;font-weight:550;
    color:var(--muted);text-decoration:none;line-height:1.3;
    transition:background .15s var(--ease),color .15s var(--ease);
  }
  .seg a.on{background:var(--panel);color:var(--fg);
            box-shadow:0 1px 3px rgba(0,0,0,.35)}

  /* ---- view tabs --------------------------------------------------------- */
  #modes{display:flex;align-items:center;gap:8px;padding:2px 14px 10px;flex:none}
  .tabs{display:flex;flex:none;background:var(--panel2);
        border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px}
  .mode{
    padding:6px 12px;border:0;border-radius:8px;background:transparent;
    color:var(--muted);font-size:12px;font-weight:550;line-height:1.3;
  }
  .mode.sel{background:var(--panel);color:var(--fg);
            box-shadow:0 1px 3px rgba(0,0,0,.35)}
  .mode:disabled{opacity:.35;cursor:default}
  #target{min-width:0;margin-left:auto;color:var(--faint);font-size:11px;
          font-family:var(--mono);white-space:nowrap;overflow:hidden;
          text-overflow:ellipsis}
  #live{flex:none;font-size:11px;color:var(--muted)}
  #live.on{color:var(--green)}

  /* ---- terminal view ----------------------------------------------------- */
  /* pre, not pre-wrap: the pane is a grid tmux already wrapped at its own
     width, and re-wrapping it a second time is what shreds TUIs. The fit
     below keeps the grid exactly the width of this box anyway. */
  #out{
    flex:1;overflow:auto;padding:12px 14px 24px;margin:0;white-space:pre;
    font:12px/1.35 var(--mono);color:var(--fg);
    -webkit-overflow-scrolling:touch;
  }
  #out.hide{display:none}

  /* ---- transcript view --------------------------------------------------- */
  #tx{
    flex:1;overflow:auto;padding:8px 14px 32px;display:none;
    -webkit-overflow-scrolling:touch;overflow-wrap:anywhere;
  }
  #tx.show{display:block}
  #txnote{color:var(--muted);font-size:11.5px;margin:4px 2px 10px}
  .m{
    border:1px solid var(--line);border-left-width:3px;border-radius:var(--r-m);
    background:var(--panel2);padding:8px 12px;margin:10px 0;
  }
  .m.user{border-left-color:var(--blue)}
  .m.assistant{border-left-color:var(--green)}
  .m.tool{border-left-color:var(--yellow);background:transparent}
  .m.result{border-left-color:var(--line2);background:transparent}
  .m .h{color:var(--muted);font-size:10.5px;font-weight:550;
        letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px}
  .m.user .h{color:var(--blue)}
  .m.assistant .h{color:var(--green)}
  .m pre{white-space:pre-wrap;word-break:break-word;margin:4px 0 2px;
         font:12.5px/1.55 var(--mono);color:var(--fg)}
  .m .md{font:13.5px/1.58 var(--sans);color:var(--fg);overflow-wrap:anywhere}
  .m .md p{margin:7px 0}
  .m .md p:first-child,.m .md h3:first-child{margin-top:3px}
  .m .md p:last-child,.m .md ul:last-child,.m .md ol:last-child{margin-bottom:2px}
  .m .md h3,.m .md h4,.m .md h5{margin:14px 0 5px;line-height:1.25;color:#fff;font-weight:700}
  .m .md h3{font-size:16px}.m .md h4{font-size:14.5px}.m .md h5{font-size:13.5px}
  .m .md strong{color:#fff;font-weight:750}.m .md em{color:var(--sub)}
  .m .md code{font:12px/1.45 var(--mono);background:rgba(138,173,244,.11);
        border:1px solid rgba(138,173,244,.16);border-radius:5px;padding:1px 4px;color:#dce5ff}
  .m .md pre{margin:9px 0;padding:10px 11px;overflow-x:auto;white-space:pre;
        word-break:normal;background:#151621;border:1px solid var(--line);border-radius:8px}
  .m .md pre code{padding:0;border:0;background:none;color:var(--fg)}
  .m .md ul,.m .md ol{margin:7px 0;padding-left:22px}.m .md li{margin:3px 0;padding-left:2px}
  .m .md blockquote{margin:8px 0;padding:2px 0 2px 11px;border-left:3px solid var(--blue);color:var(--sub)}
  .m .md-table{overflow-x:auto;margin:10px 0;border:1px solid var(--line);border-radius:8px}
  .m .md table{width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap}
  .m .md th,.m .md td{padding:7px 9px;text-align:left;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  .m .md th{background:rgba(138,173,244,.09);color:#fff;font-weight:700}
  .m .md tr:last-child td{border-bottom:0}.m .md th:last-child,.m .md td:last-child{border-right:0}
  .m.tool pre,.m.result pre{font-size:12px;color:var(--muted)}
  .m summary{color:var(--muted);font:12px/1.5 var(--mono);cursor:pointer;
             list-style-position:outside}
  .m details[open] summary{color:var(--fg)}
  .m .full-message{display:inline-block;margin-top:8px;color:var(--blue);
                   font-size:12px;text-decoration:none}

  #messagePage{display:none;flex:1;overflow:auto;padding:18px 14px 48px}
  body.message-open{display:block;max-width:760px}
  body.message-open>*:not(#messagePage){display:none!important}
  body.message-open #messagePage{display:block}
  .message-nav{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .message-nav a{color:var(--blue);text-decoration:none}
  .message-nav span{color:var(--muted);font-size:11px;text-transform:uppercase;
                    letter-spacing:.05em}
  #messageBody{font:15px/1.65 var(--sans);overflow-wrap:anywhere}

  /* ---- sessions overview ------------------------------------------------- */
  #ov{flex:1;overflow:auto;padding:8px 14px 32px;display:none;
      -webkit-overflow-scrolling:touch}
  #ov.show{display:block}
  /* Each card sits on a rail with a kill button hiding under its right edge;
     swiping the card left uncovers it. The card slides with transform so the
     reveal never reflows the list. */
  .swipe{position:relative;margin:10px 0}
  .swipe .kill{
    position:absolute;top:0;right:0;bottom:0;width:84px;border:0;
    border-radius:0 var(--r-l) var(--r-l) 0;background:var(--red);
    color:#16161e;font-size:13px;font-weight:700;letter-spacing:.02em;
  }
  /* Keyboard path to the same action: tabbing onto the hidden button slides
     the card aside just as a swipe would. */
  .swipe:has(.kill:focus-visible) .card{transform:translateX(-84px)}
  .card{
    position:relative;border:1px solid var(--line);border-radius:var(--r-l);
    background:var(--panel2);padding:12px 14px;margin:0;cursor:pointer;
    touch-action:pan-y;
    transition:border-color .2s var(--ease),box-shadow .2s var(--ease),
               background .2s var(--ease),transform .18s var(--ease);
  }
  .card.cur{border-color:var(--line2);background:var(--panel)}
  .card.blocked{
    border-color:rgba(245,169,127,.5);
    background:linear-gradient(180deg,rgba(245,169,127,.07),rgba(0,0,0,0) 55%)
               var(--panel);
    box-shadow:0 6px 24px rgba(0,0,0,.35);
    animation:needglow 2.6s var(--ease) infinite;
  }
  @keyframes needglow{
    0%,100%{box-shadow:0 6px 24px rgba(0,0,0,.35),0 0 0 0 rgba(245,169,127,0)}
    50%{box-shadow:0 6px 24px rgba(0,0,0,.35),0 0 14px 1px rgba(245,169,127,.18)}
  }
  .card .top{display:flex;align-items:center;gap:8px;min-width:0}
  .card .who{font-weight:650;font-size:14px;white-space:nowrap;
             overflow:hidden;text-overflow:ellipsis}
  .card .cmd{color:var(--faint);font:11px var(--mono);white-space:nowrap;
             overflow:hidden;text-overflow:ellipsis}
  .card .when{margin-left:auto;flex:none;color:var(--faint);font-size:11px}
  .card .snip{
    color:var(--muted);font:11.5px/1.5 var(--mono);margin-top:8px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;
  }
  /* Nothing is "idle" any more -- a state says what a session is doing and
     the age beside it says for how long. This is the recession that used to
     ride on the idle state, moved onto the age it was really about, so a
     board of long-quiet sessions still reads at a glance. */
  .card.stale .who,.card.gone .who{color:var(--muted);font-weight:550}
  .badge{
    flex:none;font-size:10px;font-weight:600;letter-spacing:.04em;
    text-transform:uppercase;padding:2px 7px;border-radius:999px;
    border:1px solid var(--line2);color:var(--muted);background:var(--well);
  }
  .st{
    display:inline-flex;align-items:center;gap:6px;
    font-size:11px;font-weight:600;letter-spacing:.02em;
    padding:3px 10px 3px 8px;border-radius:999px;
    border:1px solid var(--line);color:var(--muted);
    transition:color .2s var(--ease),background .2s var(--ease);
  }
  .st i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
  .st.working{color:var(--green);border-color:rgba(166,218,149,.25);
              background:rgba(166,218,149,.07)}
  .st.working i{animation:breathe 1.8s var(--ease) infinite}
  @keyframes breathe{0%,100%{opacity:1}50%{opacity:.35}}
  /* Yellow, which is already what a tool row is in the transcript below --
     the same thing in both places. Breathing like `working`, slower: a call
     that is out is one thing happening, not a stream of them. */
  .st.running{color:var(--yellow);border-color:rgba(238,212,159,.28);
              background:rgba(238,212,159,.08)}
  .st.running i{animation:breathe 2.4s var(--ease) infinite}
  .st.waiting{color:var(--blue);border-color:rgba(138,173,244,.28);
              background:rgba(138,173,244,.08)}
  .st.blocked{color:var(--orange);border-color:rgba(245,169,127,.35);
              background:rgba(245,169,127,.1)}
  .st.blocked i{animation:breathe 1.4s var(--ease) infinite}
  /* Breathing like `working`, because work is happening -- just not here.
     Its own colour rather than a shade of the orange that means "needs you",
     which is the one thing delegating never means. */
  .st.delegating{color:var(--mauve);border-color:rgba(198,160,246,.28);
                 background:rgba(198,160,246,.08)}
  .st.delegating i{animation:breathe 2.4s var(--ease) infinite}
  .st.gone{color:var(--faint)}
  .card.stale .st:not(.blocked){opacity:.72}

  /* the prompt card: the hero moment */
  .ask{
    margin-top:12px;padding:12px;border-radius:var(--r-m);
    background:var(--well);border:1px solid rgba(245,169,127,.22);
  }
  .ask .q{font:12px/1.55 var(--mono);color:var(--fg);white-space:pre-wrap;
    display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;
    overflow:hidden;margin-bottom:10px}
  .ask>button{
    display:flex;align-items:center;width:100%;text-align:left;gap:10px;
    margin:8px 0;padding:11px 12px;min-height:44px;
    border:1px solid var(--line2);border-radius:var(--r-m);
    background:var(--panel);color:var(--fg);font-size:13.5px;line-height:1.35;
  }
  .ask>button:active{background:var(--line)}
  /* Styled by meaning, not position: only an option that actually approves
     gets the green treatment, so a destructive first option is never the
     endorsed-looking one. */
  .ask>button.yes{
    border-color:rgba(166,218,149,.45);background:rgba(166,218,149,.1);
    color:var(--green);font-weight:600;
  }
  .ask>button.picked{border-color:rgba(138,173,244,.6);
    box-shadow:0 0 0 1px rgba(138,173,244,.35) inset}
  .ask>button.picked .k{color:var(--blue);border-color:rgba(138,173,244,.5)}
  .ask button .k{
    flex:none;min-width:22px;height:22px;display:inline-flex;
    align-items:center;justify-content:center;border-radius:7px;
    background:var(--well);border:1px solid var(--line2);
    color:var(--muted);font:11px var(--mono);
  }
  .ask>button.yes .k{color:var(--green);
    border-color:rgba(166,218,149,.4)}
  .nav{display:flex;gap:6px;margin-top:10px}
  .nav button{
    flex:1;min-height:44px;padding:8px 4px;text-align:center;font-size:13px;
    border:1px solid var(--line2);border-radius:var(--r-m);
    background:var(--panel);color:var(--muted);
  }
  .nav button:active{background:var(--line)}
  .nav button.go{border-color:rgba(166,218,149,.45);color:var(--green);
                 flex:2;font-weight:600}
  .nav button.cancel{color:var(--faint)}
  .hint{color:var(--muted);font-size:10.5px;margin-top:8px;text-align:center}

  /* the same prompt card, docked under the transcript */
  #txask{display:none;flex:none;padding:0 14px 10px;max-height:45vh;
         overflow-y:auto;-webkit-overflow-scrolling:touch}
  #txask.show{display:block}
  #txask .ask{margin-top:0;border-color:rgba(245,169,127,.35);
              background:var(--panel2)}

  /* ---- empty states ------------------------------------------------------ */
  .empty{
    text-align:center;color:var(--muted);padding:44px 20px;
  }
  .empty svg{display:block;margin:0 auto 12px;opacity:.5}
  .empty .t{font-size:14px;font-weight:600;color:var(--fg)}
  .empty .s{font-size:12.5px;color:var(--faint);margin-top:4px}

  /* ---- new agent --------------------------------------------------------- */
  #newbtn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;min-height:44px;padding:11px;margin:8px 0 4px;
    border:1px dashed var(--line2);border-radius:var(--r-l);
    background:transparent;color:var(--muted);font-size:13px;font-weight:550;
  }
  #newbtn:active{border-color:var(--green);color:var(--green)}
  #picker{display:none}
  #picker.show{display:block}
  #pq{
    width:100%;min-height:44px;padding:10px 14px;margin:8px 0 10px;
    border:1px solid var(--line2);border-radius:var(--r-m);
    background:var(--panel2);color:var(--fg);font:14px var(--sans);
    outline:none;transition:border-color .15s var(--ease);
  }
  #pq:focus{border-color:var(--blue)}
  #pq::placeholder{color:var(--faint)}
  #agents{display:flex;gap:8px;margin-bottom:10px}
  #agents button{
    flex:1;min-height:44px;padding:9px;border:1px solid var(--line);
    border-radius:var(--r-m);background:var(--panel2);color:var(--muted);
    font-size:13px;font-weight:550;
  }
  #agents button.sel{border-color:rgba(166,218,149,.45);color:var(--green);
                     background:rgba(166,218,149,.08)}
  .proj{
    width:100%;background:none;border:0;text-align:left;
    min-height:44px;padding:10px 6px;border-bottom:1px solid var(--line);
    cursor:pointer;display:flex;align-items:center;gap:10px;
  }
  .proj:last-child{border-bottom:0}
  .proj .p{font-size:13.5px}
  .proj .s{margin-left:auto;font:11px var(--mono);color:var(--muted);
           white-space:nowrap}

  /* ---- footer ------------------------------------------------------------ */
  footer{flex:none;border-top:1px solid var(--line);padding:10px 14px 12px;
         display:flex;flex-direction:column;gap:8px;background:var(--bg0)}
  #msg{font-size:12px;color:var(--muted);min-height:1.2em;padding:0 2px}
  #msg.err{color:var(--red)}
  #draft{
    width:100%;min-height:4.5rem;resize:vertical;background:var(--panel2);
    color:var(--fg);border:1px solid var(--line2);border-radius:var(--r-m);
    padding:10px 12px;font:13px/1.5 var(--mono);display:none;outline:none;
  }
  #draft:focus{border-color:var(--blue)}
  #draft.show{display:block}
  .row{display:none;gap:8px}
  .row.show{display:flex}
  .row button{
    flex:1;min-height:44px;padding:11px;border:1px solid var(--line2);
    border-radius:var(--r-m);background:var(--panel2);color:var(--muted);
    font-size:13.5px;font-weight:550;
  }
  .row button.go{border-color:rgba(138,173,244,.5);color:var(--blue);
                 background:rgba(138,173,244,.08)}
  .keys{display:flex;gap:8px}
  .keys.hide{display:none}
  .keys button:disabled{opacity:.4;cursor:default;transform:none}
  #kEnter,#kEsc,#kType,#kNav{
    flex:0 0 50px;min-height:54px;padding:0;border:1px solid var(--line2);
    border-radius:var(--r-l);background:var(--panel2);font-size:14px;
    font-weight:550;
  }
  #kEnter{color:var(--blue);border-color:rgba(138,173,244,.4)}
  #kEsc,#kType,#kNav{color:var(--muted)}
  #kType{font-size:17px;line-height:1}
  #kNav{font-size:20px;line-height:1}
  #kEnter:active,#kEsc:active,#kType:active,#kNav:active{background:var(--line)}
  /* the expanded pad: every key an agent's menus ask for, talk row swapped out */
  #navpad{display:none;flex-direction:column;gap:8px}
  #navpad.show{display:flex}
  #navpad .keys button{
    flex:1;min-height:54px;padding:0;border:1px solid var(--line2);
    border-radius:var(--r-l);background:var(--panel2);color:var(--muted);
    font-size:15px;font-weight:550;
  }
  #navpad .keys button:active{background:var(--line)}
  #navpad button[data-k="enter"]{color:var(--blue);border-color:rgba(138,173,244,.4)}
  #navpad #kNavClose{flex:0 0 50px;font-size:20px;line-height:1}
  #talk{
    flex:1;display:flex;align-items:center;justify-content:center;gap:9px;
    min-height:54px;padding:12px;border:0;border-radius:var(--r-l);
    background:var(--green);color:#16161e;font-size:16px;font-weight:700;
    letter-spacing:.01em;
    box-shadow:0 4px 18px rgba(166,218,149,.18);
  }

<body>

  </span>

  <span class="spacer"></span>
  <nav class="seg">
    <a class="on" href="/">remote</a>

  </nav>

<div id="modes">
  <div class="tabs">

<div id="ov">
  <button id="newbtn">+ new agent</button>
  <div id="picker">

</div>
<pre id="out">select a pane…</pre>
<div id="tx"><div id="txnote"></div><div id="txrows"></div></div>
<div id="txask"></div>

<div class="file-modal" id="fileModal" role="dialog" aria-modal="true"
     aria-labelledby="fileTitle" aria-hidden="true">
  <div class="file-dialog">
    <div class="file-bar">
      <button id="fileBack" type="button" hidden>back</button>
      <b id="fileTitle">file preview</b>

    </div>
    <div id="fileBody"></div>
  </div>
</div>

<footer>
  <div id="msg" role="status" aria-live="polite"></div>
  <textarea id="draft" spellcheck="false" placeholder="message the pane…"></textarea>
  <div class="row" id="actions">
    <button id="discard">discard</button>
    <button id="send">send</button>
    <button id="sendEnter" class="go">send ⏎</button>
  </div>
  <div class="keys" id="keysMain">
    <button id="kEnter" aria-label="press enter in the pane">⏎</button>
    <button id="kEsc" aria-label="press escape in the pane">esc</button>
    <button id="kType" title="type a message" aria-label="type a message">⌨</button>
    <button id="kNav" title="navigation keys" aria-label="show navigation keys" aria-expanded="false">+</button>
    <button id="talk"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><path d="M12 18v3"/></svg><span id="talklbl">talk</span></button>
  </div>
  <div id="navpad">
    <div class="keys">
      <button data-k="left" aria-label="press left arrow in the pane">←</button>
      <button data-k="down" aria-label="press down arrow in the pane">↓</button>
      <button data-k="up" aria-label="press up arrow in the pane">↑</button>
      <button data-k="right" aria-label="press right arrow in the pane">→</button>
      <button id="kNavClose" aria-label="hide navigation keys">−</button>
    </div>
    <div class="keys">
      <button data-k="esc" aria-label="press escape in the pane">esc</button>
      <button data-k="tab" aria-label="press tab in the pane">tab</button>
      <button data-k="space" aria-label="press space in the pane">space</button>
      <button data-k="enter" aria-label="press enter in the pane">⏎</button>
    </div>
  </div>
</footer>

<script>
const $ = s => document.querySelector(s);
let panes = [], sel = null, rec = null, chunks = [], busy = false, pollTimer = null;

let msgT = null;
function msg(t, err){
  const m=$('#msg'); m.textContent=t||''; m.className=err?'err':'';
  clearTimeout(msgT);
  // Feedback, not signage: a message describes the action that just
  // happened, so it retires on its own rather than narrating it forever.
  if(t) msgT = setTimeout(()=>{ m.textContent=''; m.className=''; }, 6000);
}
function connUI(ok, label){
  $('#dot').className = 'dot' + (ok ? ' live' : '');
  $('#conn').className = ok ? 'ok' : 'off';
  $('#connlbl').textContent = label;
}

// ---- ticket links ---------------------------------------------------------
// Agents talk about tickets constantly; a ticket key anywhere in their
// output becomes a link into /board. Only real project keys are matched --
// a generic [A-Z]+-\d+ would turn SHA-256 and UTF-8 into tickets.
let KEYS_RE = null;
async function loadKeys(){
  try{
    const d = await (await fetch('/api/cliban/projects')).json();
    if(d.keys && d.keys.length)
      KEYS_RE = new RegExp('\\b(?:'+d.keys.join('|')+')-\\d+\\b', 'g');
  }catch(e){ /* no cliban, no links */ }
}
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;')
                  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function linkify(s){
  const e = esc(s);
  return KEYS_RE
    ? e.replace(KEYS_RE, m=>'<a class="tick" href="/board#'+m+'">'+m+'</a>')
    : e;
}

// ---- ansi -----------------------------------------------------------------
// capture-pane -e reproduces the pane's styling as SGR sequences and nothing
// else, so a full terminal emulator is overkill: track colour and attribute
// state through one pass and wrap each run in a styled span. The 16-colour
// palette is the app's own, so the terminal sits in the theme instead of
// fighting it.
const PAL = ['#1e2030','#ed8796','#a6da95','#eed49f','#8aadf4','#f5bde6',
             '#8bd5ca','#cad3f5','#5b6078','#ed8796','#a6da95','#eed49f',
             '#8aadf4','#f5bde6','#8bd5ca','#ffffff'];
function color256(n){
  if(n<16) return PAL[n];
  if(n<232){ n-=16; const v=[0,95,135,175,215,255];
    return `rgb(${v[Math.floor(n/36)]},${v[Math.floor(n/6)%6]},${v[n%6]})`; }
  const g=8+(n-232)*10; return `rgb(${g},${g},${g})`;
}
function sgrApply(st, params){
  const p = params.length ? params.split(/[;:]/).map(x=>x?parseInt(x,10):0) : [0];
  for(let i=0;i<p.length;i++){
    const n=p[i];
    if(n===0) Object.assign(st,{fg:null,bg:null,b:0,d:0,i:0,u:0,r:0});
    else if(n===1) st.b=1;
    else if(n===2) st.d=1;
    else if(n===3) st.i=1;
    else if(n===4) st.u=1;
    else if(n===7) st.r=1;
    else if(n===22) st.b=st.d=0;
    else if(n===23) st.i=0;
    else if(n===24) st.u=0;
    else if(n===27) st.r=0;
    else if(n>=30&&n<=37) st.fg=PAL[n-30];
    else if(n===39) st.fg=null;
    else if(n>=40&&n<=47) st.bg=PAL[n-40];
    else if(n===49) st.bg=null;
    else if(n>=90&&n<=97) st.fg=PAL[n-82];
    else if(n>=100&&n<=107) st.bg=PAL[n-92];
    else if(n===38||n===48){
      let c=null;
      if(p[i+1]===5){ c=color256(p[i+2]||0); i+=2; }
      else if(p[i+1]===2){ c=`rgb(${p[i+2]||0},${p[i+3]||0},${p[i+4]||0})`; i+=4; }
      if(n===38) st.fg=c; else st.bg=c;
    }
  }
}
function sgrCSS(st){
  // Reverse swaps the roles; the fallbacks are the pane's default colours.
  const fg = st.r ? (st.bg||'#181926') : st.fg;
  const bg = st.r ? (st.fg||'#cad3f5') : st.bg;
  let css='';
  if(fg) css+='color:'+fg+';';
  if(bg) css+='background:'+bg+';';
  if(st.b) css+='font-weight:700;';
  if(st.d) css+='opacity:.55;';
  if(st.i) css+='font-style:italic;';
  if(st.u) css+='text-decoration:underline;';
  return css;
}
function ansiHTML(text){
  // Defensive: drop anything that is not SGR before parsing, so a stray
  // OSC title or cursor code degrades to nothing rather than to garbage.
  text = text.replace(/\x1b\][^\x07\x1b]*(?:\x07|\x1b\\)?/g,'')
             .replace(/\x1b\[[0-9;:?]*[A-LN-Za-ln-z]/g,'')
             .replace(/\x1b[()#][0-9A-Za-z]/g,'');
  const st={fg:null,bg:null,b:0,d:0,i:0,u:0,r:0};
  const re=/\x1b\[([0-9;:]*)m/g;
  let out='', last=0, m;
  const emit = t=>{
    if(!t) return;
    const css=sgrCSS(st), body=linkify(t);
    out += css ? '<span style="'+css+'">'+body+'</span>' : body;
  };
  while((m=re.exec(text))){
    emit(text.slice(last, m.index));
    sgrApply(st, m[1]);
    last = re.lastIndex;
  }
  emit(text.slice(last));
  return out;
}

// A failure has to own the canvas, not whisper from the footer: a blank
// sessions list reads as "no agents running", which is the opposite of the
// truth when the token expired or the server is gone.
function ovError(title, sub){
  $('#ovlist').innerHTML =
    '<div class="empty">'+
    '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" '+
    'stroke="currentColor" stroke-width="1.5" stroke-linecap="round" '+
    'stroke-linejoin="round"><circle cx="12" cy="12" r="9"/>'+
    '<path d="M12 8v4"/><path d="M12 16h.01"/></svg>'+
    '<div class="t"></div><div class="s"></div></div>';
  $('#ovlist .t').textContent = title;
  $('#ovlist .s').textContent = sub;
}

async function loadPanes(){
  try{
    const r = await fetch('/api/panes');
    if(r.status === 401){
      connUI(false, 'auth');
      ovError('not authorised',
              'open your /?token=… login link once, then come back');
      return;
    }
    const d = await r.json();
    if(!d || !Array.isArray(d.panes)) return;
    $('#host').textContent = d.host; connUI(true, 'live');
    panes = d.panes;
    // A selection that outlived its pane must not keep aiming the footer at
    // a target tmux no longer has; fall through to the active pane instead.
    if(sel && !panes.some(p=>p.id===sel)){ sel = null; msg('selected pane closed'); }
    if(!sel && panes.length) sel = (panes.find(p=>p.active)||panes[0]).id;
    syncTarget();
  }catch(e){
    connUI(false, 'offline');
    ovError('cannot reach the server', 'retrying automatically');
  }
}

// "session:window-name" when tmux has a real name for the window; the bare
// index only when the name is just the running command (tmux's default),
// where it would duplicate the cmd already shown beside it.
function paneLabel(p){
  return p.session + ':' + (p.name && p.name !== p.cmd ? p.name : p.window);
}

// Nothing in the footer works without a target pane; disarm the keys rather
// than letting them fail after the tap.
function updateFooter(){
  const has = !!sel;
  $('#kEnter').disabled = $('#kEsc').disabled = $('#kType').disabled =
    $('#kNav').disabled = !has;
  document.querySelectorAll('#navpad [data-k]').forEach(b=> b.disabled = !has);
  $('#talk').disabled = !has || !voiceOK;
}

// There used to be a strip of pane chips above this, one per pane, scrolling
// sideways. It said nothing the sessions list below it did not say better --
// the list has the state, the age and the question, where a chip had only a
// name -- so it cost a row of screen on a phone to duplicate the page you
// were already looking at. Selecting a pane is the list's job now.
function syncTarget(){
  const p = panes.find(x=>x.id===sel);
  $('#target').textContent = p ? `${paneLabel(p)} ${p.cmd}` : '';
  updateFooter();
}

// ---- transcript view ------------------------------------------------------
// The pane is the source of truth for *what is happening now*; the transcript
// is the readable record. Terminal stays the default because the JSONL lags a
// live turn by a few seconds and shows no spinner.
let session = null, es = null;

async function loadSession(){
  session = null;
  $('#mTx').disabled = true;
  if(!sel) return;
  try{
    const r = await fetch('/api/session?pane='+encodeURIComponent(sel));
    const d = await r.json();
    if(d && d.kind){
      session = d;
      $('#mTx').disabled = false;
      $('#mTx').textContent = 'transcript · ' + d.kind;
    }else{
      $('#mTx').textContent = 'transcript';
      if(mode==='tx') setMode('term');
    }
  }catch(e){ /* leave the button disabled */ }
}

const FILE_EXT_RE = /\.(?:c|cc|cpp|css|csv|gif|go|h|hpp|html?|ico|java|jpeg|jpg|js|json|jsx|lua|md|mjs|pdf|php|png|py|rb|rs|sh|svg|toml|ts|tsx|txt|webp|xml|ya?ml)(?::[1-9]\d*)?$/i;
function fileReference(value, allowExtensionless){
  if(!value || /^(?:[a-z]+:)?\/\//i.test(value) || /[<>"']/.test(value)) return false;
  const path = value.replace(/:[1-9]\d*$/, '');
  if(FILE_EXT_RE.test(value)) return true;
  return !!allowExtensionless && /^[\w@+.,=()\/-]+$/.test(path);
}
function fileButton(label, reference, code){
  return '<button type="button" class="file-ref" data-reference="'+esc(reference)+'">'+
         (code ? '<code>'+esc(label)+'</code>' : esc(label))+'</button>';
}
function fileLinkify(text){
  const token = /(?:\.{0,2}\/)?[\w@+.,=()-]+(?:\/[\w@+.,=()-]+)+(?::[1-9]\d*)?|[\w@+-]+\.[\w.+-]+(?::[1-9]\d*)?/g;
  let out='', at=0, m;
  while((m=token.exec(text))){
    let value=m[0], trailing='';
    while(/[),.;!?]$/.test(value)){ trailing=value.slice(-1)+trailing; value=value.slice(0,-1); }
    out += linkify(text.slice(at,m.index));
    // Slash-separated prose is often a label (HTML/CSS, read/write, TCP/IP),
    // not a path. Extensionless paths need explicit backticks or Markdown.
    out += fileReference(value, false) ? fileButton(value,value,false) : linkify(value);
    out += linkify(trailing); at=m.index+m[0].length;
  }
  return out+linkify(text.slice(at));
}

function markdownInline(text){
  let out = '', at = 0;
  const token = /\[([^\]\n]+)\]\(([^)\n]+)\)|(`+)([\s\S]*?)\3|\*\*([^\n*]+)\*\*|__([^\n_]+)__/g;
  let m;
  while((m=token.exec(text))){
    out += fileLinkify(text.slice(at, m.index));
    if(m[1]) out += fileReference(m[2],true) ? fileButton(m[1],m[2],false) :
      esc(m[1])+' ('+fileLinkify(m[2])+')';
    else if(m[3]) out += fileReference(m[4],true) ? fileButton(m[4],m[4],true) :
      '<code>'+esc(m[4])+'</code>';
    else out += '<strong>'+markdownInline(m[5] || m[6])+'</strong>';
    at = token.lastIndex;
  }
  out += fileLinkify(text.slice(at));
  return out.replace(/(^|[\s(])\*([^*\n]+)\*(?=$|[\s).,!?])/g,
                     '$1<em>$2</em>');
}

function markdownHTML(text){
  const lines = text.replace(/\r\n?/g, '\n').split('\n');
  const out = [];
  const cells = line => line.trim().replace(/^\||\|$/g, '')
    .split('|').map(s=>s.trim());
  const divider = line => cells(line).length > 0 &&
    cells(line).every(s=>/^:?-{3,}:?$/.test(s));
  let i = 0;
  while(i < lines.length){
    if(!lines[i].trim()){ i++; continue; }
    if(/^\s*```/.test(lines[i])){
      const code = [];
      for(i++; i < lines.length && !/^\s*```/.test(lines[i]); i++) code.push(lines[i]);
      if(i < lines.length) i++;
      out.push('<pre><code>'+esc(code.join('\n'))+'</code></pre>');
      continue;
    }
    if(i+1 < lines.length && lines[i].includes('|') && divider(lines[i+1])){
      const head = cells(lines[i]); i += 2;
      const body = [];
      while(i < lines.length && lines[i].includes('|') && lines[i].trim())
        body.push(cells(lines[i++]));
      out.push('<div class="md-table"><table><thead><tr>'+
        head.map(c=>'<th>'+markdownInline(c)+'</th>').join('')+
        '</tr></thead><tbody>'+body.map(row=>'<tr>'+row.map(c=>
          '<td>'+markdownInline(c)+'</td>').join('')+'</tr>').join('')+
        '</tbody></table></div>');
      continue;
    }
    const heading = lines[i].match(/^(#{1,3})\s+(.+)$/);
    if(heading){
      const level = heading[1].length + 2;
      out.push('<h'+level+'>'+markdownInline(heading[2])+'</h'+level+'>'); i++; continue;
    }
    const item = lines[i].match(/^\s*(?:([-*+])|(\d+)[.)])\s+(.+)$/);
    if(item){
      const tag = item[2] ? 'ol' : 'ul', rows = [];
      while(i < lines.length){
        const next = lines[i].match(/^\s*(?:([-*+])|(\d+)[.)])\s+(.+)$/);
        if(!next || (next[2] ? 'ol' : 'ul') !== tag) break;
        rows.push('<li>'+markdownInline(next[3])+'</li>'); i++;
      }
      out.push('<'+tag+'>'+rows.join('')+'</'+tag+'>'); continue;
    }
    if(/^\s*>/.test(lines[i])){
      const quote = [];
      while(i < lines.length && /^\s*>/.test(lines[i]))
        quote.push(lines[i++].replace(/^\s*>\s?/, ''));
      out.push('<blockquote>'+markdownInline(quote.join(' '))+'</blockquote>'); continue;
    }
    const para = [];
    while(i < lines.length && lines[i].trim() &&
          !/^\s*```|^#{1,3}\s|^\s*(?:[-*+] |\d+[.)] |>) /.test(lines[i]))
      para.push(lines[i++].trim());
    out.push('<p>'+markdownInline(para.join(' '))+'</p>');
  }
  return out.join('');
}

function filePreviewState(result){
  const candidates = Array.isArray(result && result.candidates)
    ? result.candidates.slice(0,20) : [];
  if(!candidates.length) return {view:'empty',candidates:[],line:null};
  if(candidates.length===1) return {view:'preview',candidates,path:candidates[0].path,
                                    line:result.line || null};
  return {view:'matches',candidates,line:result.line || null};
}
function filePreviewBack(state){
  return state && state.candidates && state.candidates.length>1
    ? Object.assign({},state,{view:'matches',path:null}) : state;
}

let filePreview = null, filePreviewReturnFocus = null;
function closeFilePreview(){
  const modal=$('#fileModal'); modal.classList.remove('show');
  modal.setAttribute('aria-hidden','true'); document.body.classList.remove('preview-open');
  const back=filePreviewReturnFocus; filePreview=null; filePreviewReturnFocus=null;
  if(back && back.isConnected) back.focus();
}
function previewURL(path,line){
  const q=new URLSearchParams({pane:sel,path}); if(line) q.set('line',line);
  return '/api/files/preview?'+q;
}

function highlightCode(path,text){
  const name=path.toLowerCase(), ext=(name.match(/\.([^.\/]+)$/)||[])[1]||'';
  let words='';
  if(['py'].includes(ext)) words='and as assert async await break class continue def del elif else except false finally for from global if import in is lambda none nonlocal not or pass raise return true try while with yield';
  else if(['js','jsx','mjs','cjs','ts','tsx'].includes(ext)) words='async await break case catch class const continue debugger default delete do else export extends false finally for from function get if import in instanceof let new null of return set static super switch this throw true try typeof undefined var void while with yield';
  else if(['sh','bash','zsh','fish'].includes(ext)) words='break case continue do done elif else esac exit export fi for function if in local readonly return set then unset until while';
  else if(['json'].includes(ext)) words='false null true';
  else if(['rs'].includes(ext)) words='as async await break const continue crate dyn else enum extern false fn for if impl in let loop match mod move mut pub ref return self Self static struct super trait true type unsafe use where while';
  else if(['go'].includes(ext)) words='break case chan const continue default defer else fallthrough false for func go goto if import interface map nil package range return select struct switch true type var';
  else if(['c','h','cc','cpp','cxx','hpp'].includes(ext)) words='auto bool break case catch char class const constexpr continue default delete do double else enum explicit extern false float for friend if inline int long namespace new nullptr private protected public register return short signed sizeof static struct switch template this throw true try typedef typename union unsigned using virtual void volatile while';
  else if(['html','htm','svg','css','md','markdown'].includes(ext)) words='html head body script style div span class id import media display position color background border margin padding width height flex grid';
  else if(['toml','yaml','yml'].includes(ext) || /(^|\/)(cookfile|makefile)$/.test(name)) words='false true null';
  else return esc(text);
  const keys=new Set(words.split(' '));
  const token=/(<!--[\s\S]*?-->|\/\*[\s\S]*?\*\/|\/\/.*|#.*|[rubf]*"(?:\\.|[^"\\])*"|[rubf]*'(?:\\.|[^'\\])*'|`(?:\\.|[^`\\])*`|\b(?:0x[\da-f]+|\d+(?:\.\d+)?)\b|[A-Za-z_$][\w$-]*)/gi;
  let out='',at=0,m;
  while((m=token.exec(text))){
    out+=esc(text.slice(at,m.index)); const t=m[0]; let cls='';
    if(/^(?:<!--|\/\*|\/\/|#)/.test(t)) cls='syn-comment';
    else if(/^[rubf]*["'`]/i.test(t)) cls='syn-string';
    else if(/^(?:0x[\da-f]+|\d)/i.test(t)) cls='syn-number';
    else if(keys.has(t.toLowerCase())) cls='syn-key';
    out+=cls?'<span class="'+cls+'">'+esc(t)+'</span>':esc(t); at=token.lastIndex;
  }
  return out+esc(text.slice(at));
}
async function renderFilePreview(path){
  const body=$('#fileBody'); body.textContent=''; $('#fileTitle').textContent=path;
  $('#fileBack').hidden=!(filePreview.candidates.length>1);
  const candidate=filePreview.candidates.find(c=>c.path===path) || {};
  if(candidate.kind==='image' || candidate.kind==='svg'){
    const img=document.createElement('img'); img.className='file-image'; img.alt=path;
    img.src=previewURL(path,filePreview.line); body.appendChild(img); return;
  }
  try{
    const r=await fetch(previewURL(path,filePreview.line)); if(!r.ok) throw new Error();
    const data=await r.json(); const pre=document.createElement('pre'); pre.className='file-text';
    (data.lines || []).forEach(line=>{
      const row=document.createElement('span'); row.className='file-line'+
        (data.line===line.number?' focus':'');
      const number=document.createElement('span'); number.className='file-number';
      number.textContent = line.number; row.appendChild(number);
      const code=document.createElement('span'); code.className='file-code';
      code.innerHTML=highlightCode(path,line.text); row.appendChild(code); pre.appendChild(row);
    }); body.appendChild(pre);
  }catch(e){ body.innerHTML='<div class="file-empty">preview unavailable</div>'; }
}
function renderFileState(){
  const body=$('#fileBody'); body.textContent='';
  $('#fileBack').hidden=true; $('#fileTitle').textContent='file preview';
  if(filePreview.view==='empty'){
    const empty=document.createElement('div'); empty.className='file-empty';
    empty.textContent='no tracked file found'; body.appendChild(empty); return;
  }
  if(filePreview.view==='preview'){ renderFilePreview(filePreview.path); return; }
  const list=document.createElement('div'); list.className='file-matches';
  filePreview.candidates.forEach(candidate=>{
    const button=document.createElement('button'); button.type='button';
    button.className='file-match'; button.textContent=candidate.path;
    button.onclick=()=>{ filePreview.view='preview'; filePreview.path=candidate.path;
      renderFilePreview(candidate.path); };

}

function card(row){
  const el = document.createElement('div');
  el.className = 'm ' + row.cls;
  const head = document.createElement('div');
  head.className = 'h';
  head.textContent = row.label + ' · ' + row.ts;
  el.appendChild(head);
  const pre = document.createElement('pre');
  pre.innerHTML = linkify(row.text);
  if(row.cls==='tool' || row.cls==='result'){
    // Tool traffic outnumbers conversation several to one; collapsed keeps
    // the actual exchange readable on a phone.
    const d = document.createElement('details');
    const s = document.createElement('summary');
    const first = (row.text.split('\n')[0] || '(empty)').slice(0,90);
    s.textContent = first;
    // Open, the full text starts with the same line the summary shows;
    // swap the summary for a plain collapse handle instead of repeating it.
    d.addEventListener('toggle', ()=>{ s.textContent = d.open ? 'hide' : first; });
    d.appendChild(s); d.appendChild(pre); el.appendChild(d);
  }else{
    const body = document.createElement('div');
    body.className = 'md'; body.innerHTML = markdownHTML(row.text);
    el.appendChild(body);
    if(row.clipped && row.ref){
      const full = document.createElement('a');
      full.className = 'full-message'; full.textContent = 'view full message';
      full.href = '/message?pane='+encodeURIComponent(sel)+'&ref='+encodeURIComponent(row.ref);
      el.appendChild(full);
    }
  }
  return el;
}

function pinned(){
  const t = $('#tx');
  return t.scrollTop + t.clientHeight >= t.scrollHeight - 60;
}

function stopStream(){
  if(es){ es.close(); es = null; }
  $('#live').textContent = ''; $('#live').className = '';
}

function startStream(){
  stopStream();
  $('#txrows').innerHTML = ''; $('#txnote').textContent = '';
  if(!sel || !session) return;
  es = new EventSource('/api/stream?pane='+encodeURIComponent(sel));

  es.addEventListener('init', e=>{
    const d = JSON.parse(e.data);
    if(d.total > d.shown)
      $('#txnote').textContent = `showing the last ${d.shown} of ${d.total} entries`;
  });
  es.addEventListener('row', e=>{
    // Only follow if already at the bottom, so scrolling back through
    // history is not yanked away every time the agent does something.
    const stick = pinned();
    $('#txrows').appendChild(card(JSON.parse(e.data)));
    if(stick) $('#tx').scrollTop = $('#tx').scrollHeight;
  });
  es.addEventListener('ready', ()=>{
    $('#tx').scrollTop = $('#tx').scrollHeight;
    $('#live').textContent = '● live'; $('#live').className = 'on';
    if(!$('#txrows').children.length && !$('#txnote').textContent)
      $('#txnote').textContent = 'no transcript yet — it fills in as the agent works';
  });
  es.onerror = ()=>{ $('#live').textContent = '○ reconnecting'; $('#live').className=''; };
}

// ---- sessions overview ----------------------------------------------------
function ago(s){
  if(s===null||s===undefined) return '';
  if(s<60) return s+'s ago';
  if(s<3600) return Math.floor(s/60)+'m ago';
  return Math.floor(s/3600)+'h ago';
}

// Voice is a server-side capability the server probes itself (whisper
// reachable, ffmpeg present). When it is off the talk button greys out up
// front instead of failing after you have already spoken.
let voiceOK = true;
function setVoice(v){
  v = !!v;
  if(v === voiceOK) return;
  voiceOK = v;
  $('#talk').title = v ? '' : 'voice not configured';
  updateFooter();
  if(!rec && !busy) $('#talklbl').textContent = v ? 'talk' : 'voice off';
}

// The answered-but-unconfirmed option, so the card can show what you picked
// between the digit press and the ⏎ that submits it.
let lastPick = null;                   // {pane, key, t}

const YES_RE = /^\s*(yes|allow|approve|proceed|run|ok)\b/i;

// One prompt card for anywhere a prompt appears: the overview and the
// transcript dock render the exact same thing.
function buildAsk(p, prompt){
  const ask = document.createElement('div');
  ask.className = 'ask';
  const q = document.createElement('div');
  q.className = 'q'; q.innerHTML = linkify(prompt.question);
  ask.appendChild(q);
  let greened = false;
  prompt.options.forEach(o=>{
    const b = document.createElement('button');
    b.type = 'button';
    // Green marks the plain approval. Only the first yes-option gets it:
    // "Yes, and don't ask again" is a broader grant and should not look
    // equally endorsed — and a destructive first option gets nothing.
    if(!greened && YES_RE.test(o.label)){ b.classList.add('yes'); greened = true; }
    if(lastPick && lastPick.pane===p.id && lastPick.key===o.key &&
       Date.now()-lastPick.t < 60000) b.classList.add('picked');
    b.innerHTML = `<span class="k">${o.key}</span>`;
    b.appendChild(document.createTextNode(o.label));
    // stopPropagation: the whole card is clickable, and answering must
    // not also navigate you away from the list.
    b.onclick = ev=>{ ev.stopPropagation(); answer(p, o); };
    ask.appendChild(b);
  });

  // A digit only moves or toggles; confirming is a separate press. Some
  // prompts are multi-select, where pairing the two would submit after
  // the first checkbox.
  const nav = document.createElement('div');
  nav.className = 'nav';
  [['↑','up','','move selection up'],['↓','down','','move selection down'],
   ['⏎ enter','enter','go','confirm with enter'],
   ['esc','esc','cancel','cancel with escape']]
    .forEach(([txt,key,cls,label])=>{
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = txt;
      b.setAttribute('aria-label', label);
      if(cls) b.classList.add(cls);
      b.onclick = ev=>{ ev.stopPropagation(); press(p, key); };
      nav.appendChild(b);
    });
  ask.appendChild(nav);
  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = 'numbers select or toggle · ⏎ enter above submits';
  ask.appendChild(hint);
  return ask;
}

// Seconds of quiet after which a card recedes. Purely how it looks: the
// server has no such state, and a session that has been waiting on you all
// afternoon still says so. This only stops a long board from shouting every
// line at once.
const STALE_AFTER = 300;

async function loadOverview(){
  let d;
  try{
    const r = await fetch('/api/overview');
    if(r.status === 401) return;       // loadPanes owns the auth error state
    d = await r.json();
  }
  catch(e){ return; }
  if(!d || !Array.isArray(d.panes)) return;
  if('voice' in d) setVoice(d.voice);
  const box = $('#ovlist'); box.innerHTML = '';
  d.panes.forEach(p=>{
    const el = document.createElement('div');
    el.className = 'card' + (p.id===sel ? ' cur' : '') +
                   (p.state ? ' '+p.state : '') +
                   (p.age !== null && p.age > STALE_AFTER ? ' stale' : '');
    // Keyboard path onto a clickable card; the buttons inside remain their
    // own tab stops.
    el.tabIndex = 0;
    el.setAttribute('role', p.prompt ? 'group' : 'button');
    el.setAttribute('aria-label', 'open ' + paneLabel(p));
    const agent = `<span class="badge">${esc(p.kind || 'shell')}</span>`;
    const label = {working:'working', running:'tool running',
                   waiting:'waiting on you', delegating:'agents working',
                   blocked:'needs you', gone:'gone'};
    const st = p.state ? `<span class="st ${esc(p.state)}"><i></i>${label[p.state]||esc(p.state)}</span>` : '';
    // The badge already names the agent; repeating the pane command next to
    // it says the same thing twice.
    const cmd = p.cmd && p.cmd !== p.kind
      ? `<span class="cmd">${esc(p.cmd)}</span>` : '';
    el.innerHTML =
      `<div class="top"><span class="who">${esc(paneLabel(p))}</span>`+
      `${agent}${cmd}`+
      `<span class="when">${ago(p.age)}</span></div>`+
      (st ? `<div class="top" style="margin-top:8px">${st}</div>` : '')+
      (p.last && !p.prompt ? `<div class="snip"></div>` : '');
    if(p.last && !p.prompt) el.querySelector('.snip').innerHTML = linkify(p.last);

    if(p.prompt) el.appendChild(buildAsk(p, p.prompt));

    // A ticket link inside the card should open the board, not also select
    // the pane underneath it.
    el.querySelectorAll('a.tick').forEach(a=>
      a.onclick = ev=> ev.stopPropagation());
    const wrap = document.createElement('div');
    wrap.className = 'swipe';
    wrap.dataset.pane = p.id;
    const kb = document.createElement('button');
    kb.className = 'kill';
    kb.textContent = 'kill';
    kb.setAttribute('aria-label', 'kill ' + paneLabel(p));
    kb.onclick = ()=> killPane(p.id, paneLabel(p));
    wrap.appendChild(kb);
    wrap.appendChild(el);
    el.onclick = ()=>{
      if(swipeDrag) return;
      // An uncovered kill button means the tap is about the reveal, not the
      // pane: put the card back rather than navigating under the thumb.
      if(swipeOpen){ closeSwipe(); return; }
      sel = p.id; msg(''); syncTarget(); loadOut();
      loadSession().then(()=> setMode(p.kind ? 'tx' : 'term'));
    };
    el.onkeydown = ev=>{
      if(ev.target===el && (ev.key==='Enter' || ev.key===' ')){
        ev.preventDefault(); el.onclick();
      }
    };
    attachSwipe(wrap, el, p.id);
    // The overview refreshes every few seconds; a reveal the user opened
    // must survive the redraw or it would snap shut mid-decision.
    if(swipeOpen === p.id){
      wrap.classList.add('open');
      el.style.transform = 'translateX(-84px)';
    }
    box.appendChild(wrap);
  });
  if(!d.panes.length) box.innerHTML =
    '<div class="empty">'+
    '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" '+
    'stroke="currentColor" stroke-width="1.5" stroke-linecap="round" '+
    'stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="3"/>'+
    '<path d="M7 9l3 2.5L7 14"/><path d="M12 15h5"/></svg>'+
    '<div class="t">no agents running</div>'+
    '<div class="s">start one with “new agent” above</div></div>';
}

// ---- swipe-to-kill ---------------------------------------------------------
// One reveal at a time, remembered across redraws by pane id. swipeDrag is
// true from the moment a press turns into a drag until just after the click
// that follows it, so a drag never doubles as a tap on whatever it crossed.
let swipeOpen = null, swipeDrag = false;

function closeSwipe(){
  swipeOpen = null;
  document.querySelectorAll('#ovlist .swipe.open').forEach(w=>{
    w.classList.remove('open');
    w.querySelector('.card').style.transform = '';
  });
}

// touch-action:pan-y settles the gesture argument: the browser keeps vertical
// scrolling and cancels our pointer stream, so anything still alive here is
// horizontal by decree, not by guesswork.
function attachSwipe(wrap, card, id){
  let down = false, x0 = 0, start = 0;
  const place = px => { card.style.transform = px ? `translateX(${px}px)` : ''; };
  const settle = open => {
    card.style.transition = '';
    if(open){ closeSwipe(); swipeOpen = id; wrap.classList.add('open'); place(-84); }
    else { if(swipeOpen === id) swipeOpen = null; wrap.classList.remove('open'); place(0); }
  };
  card.addEventListener('pointerdown', ev=>{
    if(ev.pointerType === 'mouse' && ev.button !== 0) return;
    down = true; x0 = ev.clientX;
    start = wrap.classList.contains('open') ? -84 : 0;
    card.setPointerCapture(ev.pointerId);
  });
  card.addEventListener('pointermove', ev=>{
    if(!down) return;
    const dx = ev.clientX - x0;
    if(!swipeDrag && Math.abs(dx) < 6) return;   // still could be a tap
    swipeDrag = true;
    card.style.transition = 'none';
    place(Math.max(-96, Math.min(0, start + dx)));
  });
  card.addEventListener('pointerup', ev=>{
    if(!down) return; down = false;
    if(swipeDrag) settle(start + ev.clientX - x0 < -42);
    // The click this press produces fires next; let it see the drag flag,
    // then clear it for the taps that follow.
    setTimeout(()=>{ swipeDrag = false; }, 0);
  });
  card.addEventListener('pointercancel', ()=>{
    if(!down) return; down = false;
    settle(wrap.classList.contains('open'));
    swipeDrag = false;
  });
  // A drag that started on a prompt-option button must not also answer the
  // prompt when the finger lifts over it.
  wrap.addEventListener('click', ev=>{
    if(swipeDrag){ ev.stopPropagation(); ev.preventDefault(); }
  }, true);
}

async function killPane(id, label){
  try{
    const r = await fetch('/api/kill', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({pane: id})});
    const d = await r.json();
    if(d.error) return msg(d.error, true);
    closeSwipe();
    // The dead pane may have been the footer's target.
    if(sel === id){ sel = null; syncTarget(); }
    msg('killed ' + label);
    loadPanes(); loadOverview();
  }catch(e){ msg('failed: ' + e.message, true); }
}

// A dead card is the one thing the sessions page must not show. The full
// overview costs a transcript tail per agent pane, so it keeps its slow
// cadence -- but list-panes is a single tmux call, cheap enough to poll
// hard. Prune corpses from the DOM the moment the pane list stops naming
// them, and redraw properly only when the set actually changed.
async function reconcileOv(){
  await loadPanes();                 // one cheap fetch: strip, sel check, diff
  const live = new Set(panes.map(p=>p.id));
  let changed = false;
  const shown = new Set();
  document.querySelectorAll('#ovlist .swipe').forEach(w=>{
    if(!live.has(w.dataset.pane)){ w.remove(); changed = true; }
    else shown.add(w.dataset.pane);
  });
  if(!changed) changed = [...live].some(id=>!shown.has(id));
  if(changed) loadOverview();
}

async function press(pane, key){
  try{
    const r = await fetch('/api/answer', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({pane: pane.id, key})});
    const d = await r.json();
    if(d.error){ msg(d.error, true); return false; }
    // Redraw quickly so a toggled checkbox or moved cursor is visible; the
    // TUI needs a moment to repaint before capture-pane sees it.
    setTimeout(()=>{ loadOverview(); pollPrompt(); }, 400);
    return true;
  }catch(e){ msg('failed: '+e.message, true); return false; }
}

async function answer(pane, opt){
  lastPick = {pane: pane.id, key: opt.key, t: Date.now()};
  if(!await press(pane, opt.key)) return;
  // "tell it what to do differently" leaves the agent waiting for text, so
  // select that pane and open the composer ready to say it.
  if(/differently|tell .* what|type something|chat about/i.test(opt.label)){
    sel = pane.id; syncTarget(); loadOut();
    await loadSession();
    $('#draft').classList.add('show');
    $('#actions').classList.add('show');
    $('#draft').focus();
    msg('tell it what to do — type or talk');
  }else{
    msg(`picked ${opt.key} · confirm with ⏎ enter on the card`);
  }
}

// ---- new agent -------------------------------------------------------------
// Mirrors the ftz fish function: pick a directory the server found, derive
// the session name from it, and reuse the session if it already exists -- a
// new window rather than a second session for the same project.
let agent = 'claude';

// Every keystroke starts a search and the server abandons the one before it,
// so replies can arrive out of order. Only the newest request may draw: a
// late reply to a query the user has already typed past would otherwise
// repaint the list with an answer to a question nobody is asking.
let pqSeq = 0;

async function loadProjects(){
  const q = $('#pq').value.trim();
  const seq = ++pqSeq;
  let d;
  try{ d = await (await fetch('/api/projects?q='+encodeURIComponent(q))).json(); }
  catch(e){ return; }
  if(seq !== pqSeq) return;
  // The server dropped this search for a newer one. Its empty list is not an
  // answer, so leave what is on screen and ask again -- another client can
  // supersede us, and blanking the list for their keystroke would be absurd.
  if(d && d.superseded){ return loadProjects(); }
  const box = $('#plist'); box.innerHTML = '';
  if(!d || !Array.isArray(d.projects)) return;
  d.projects.forEach(p=>{
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'proj';
    el.innerHTML = `<span class="p"></span><span class="s">${
      p.exists ? '↳ '+esc(p.session) : esc(p.session)}</span>`;
    el.querySelector('.p').textContent = p.short;
    el.onclick = ()=> spawn(p);
    box.appendChild(el);
  });
  if(!d.projects.length) box.textContent = 'nothing matching';
}

async function spawn(p){
  msg(`starting ${agent} in ${p.session}…`);
  try{
    const r = await fetch('/api/spawn', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({dir:p.dir, agent})});
    const d = await r.json();
    if(d.error) return msg(d.error, true);
    msg(`${agent} started · new ${d.created} in ${d.session}`);
    togglePicker(false);
    sel = d.pane;
    await loadPanes(); syncTarget(); loadOut();
    // A fresh agent has no transcript yet, so start on the terminal and let
    // the transcript button enable itself once there is something to show.
    await loadSession(); setMode('term');
  }catch(e){ msg('spawn failed: '+e.message, true); }
}

function togglePicker(on){
  $('#picker').classList.toggle('show', on);
  $('#ovlist').style.display = on ? 'none' : '';
  $('#newbtn').textContent = on ? '× cancel' : '+ new agent';
  if(on){ $('#pq').value=''; loadProjects(); $('#pq').focus(); }
}

$('#newbtn').onclick = ()=> togglePicker(!$('#picker').classList.contains('show'));
$('#pq').addEventListener('input', ()=>{
  clearTimeout(window._pqT);
  window._pqT = setTimeout(loadProjects, 150);   // debounce typing on a phone
});
document.querySelectorAll('#agents button').forEach(b=>{
  b.onclick = ()=>{
    agent = b.dataset.a;
    document.querySelectorAll('#agents button').forEach(x=>
      x.classList.toggle('sel', x===b));
  };
});

// ---- prompt dock ----------------------------------------------------------
// The transcript lags a live turn, so a permission prompt only exists in the
// pane — which the transcript view hides. Poll the (cheap) prompt endpoint
// and dock the same answer card the overview shows, under the transcript.
let promptSig = null;

function renderTxAsk(prompt){
  const box = $('#txask');
  if(!prompt || mode!=='tx'){
    box.innerHTML = ''; box.classList.remove('show'); promptSig = null;
    return;
  }
  // Re-render only when the prompt (or the picked option) actually changed,
  // so polling doesn't yank focus off a button mid-tap.
  const sig = sel + '|' + prompt.question + '|' +
    prompt.options.map(o=>o.key+o.label).join(';') + '|' +
    (lastPick ? lastPick.pane+lastPick.key+lastPick.t : '');
  if(sig === promptSig) return;
  promptSig = sig;
  const stick = pinned();
  box.innerHTML = '';
  box.appendChild(buildAsk(panes.find(x=>x.id===sel) || {id: sel}, prompt));
  box.classList.add('show');
  if(stick) $('#tx').scrollTop = $('#tx').scrollHeight;
}

async function pollPrompt(){
  if(mode!=='tx' || !sel) return renderTxAsk(null);
  try{
    const r = await fetch('/api/prompt?pane='+encodeURIComponent(sel));
    if(!r.ok) return;
    const d = await r.json();
    if(mode==='tx') renderTxAsk(d && d.prompt);
  }catch(e){ /* keep the last card; the next poll retries */ }
}

let mode = 'ov';
function setMode(m){
  if(m==='tx' && !session) return;
  mode = m;
  msg('');
  $('#mOv').classList.toggle('sel', m==='ov');
  $('#mTerm').classList.toggle('sel', m==='term');
  $('#mTx').classList.toggle('sel', m==='tx');
  $('#ov').classList.toggle('show', m==='ov');
  $('#out').classList.toggle('hide', m!=='term');
  $('#tx').classList.toggle('show', m==='tx');
  if(m==='tx'){ startStream(); pollPrompt(); }
  else{ stopStream(); renderTxAsk(null); }
  if(m==='ov') loadOverview();
  if(m==='term') autoFit(); else releaseFit();
}

// The poll refetches every 2s, and /api/pane speaks a diff protocol: this
// side holds the history window it was last sent plus two opaque tokens
// {hh, sh} naming it, echoes the tokens back, and applies what returns. An
// idle pane answers {same} and costs nothing; a TUI repaint carries the
// screen alone; a scroll adds only the lines that crossed into history.
// Patches are trusted blindly because the server computed them against the
// exact window the token names -- applying {drop, add} reproduces its
// window byte for byte. A response without tokens is an old server still
// sending whole text, and is rendered as such.
let outHist = [], outScreen = '', outHH = '', outSH = '', outPane = null;
// The render is keyed on what it depends on -- pane, text, and whether the
// ticket-link table had arrived yet -- so re-parsing hundreds of history
// lines into spans happens only when a poll actually changed something,
// scroll position included.
let lastOutSig = null;
async function loadOut(){
  if(!sel) return;
  try{
    if(sel !== outPane){
      outPane = sel; outHist = []; outScreen = ''; outHH = ''; outSH = '';
    }
    const r = await fetch('/api/pane?id='+encodeURIComponent(sel)+'&df=1'
      +(outHH ? '&hh='+outHH+'&sh='+outSH : ''));
    const d = await r.json();
    if(sel !== outPane) return;   // switched panes while this was in flight
    const out = $('#out');
    if(d.hh){
      if(!d.same){
        if(d.hist !== undefined) outHist = d.hist;
        else outHist = outHist.slice(d.drop||0).concat(d.add||[]);
        outScreen = d.screen;
      }
      outHH = d.hh; outSH = d.sh;
    }else if(d.text !== undefined){
      outHist = []; outScreen = d.text; outHH = ''; outSH = '';
    }
    const text = (outHist.length ? outHist.join('\n')+'\n' : '')
                 + (outScreen || (outHist.length ? '' : '(empty)'));
    const outSig = (KEYS_RE?'k':'') + sel + '\n' + text;
    if(outSig !== lastOutSig){
      lastOutSig = outSig;
      const stuck = out.scrollTop + out.clientHeight >= out.scrollHeight - 30;
      out.innerHTML = ansiHTML(text);
      if(stuck) out.scrollTop = out.scrollHeight;
    }
    // Drift check: if the window is not the size we hold it at -- lease lost
    // to a server restart, or something resized it underneath us -- while
    // this view is the one watching, re-assert. Damped so two viewers
    // disagreeing degrades to a slow tug-of-war rather than a fast one.
    if(fitted===sel && lastFit && d.cols &&
       (d.cols!==lastFit.cols || d.rows!==lastFit.rows) &&
       Date.now()-(window._healT||0) > 5000){
      window._healT = Date.now();
      autoFit();
    }
  }catch(e){}
}

// ---- fit ------------------------------------------------------------------
// tmux keeps one grid per pane, so the only way to make it readable on a
// phone is to actually resize the window -- which reflows it for the desktop
// too. Viewing the terminal IS the request: the fit is acquired on entering
// the view, renewed implicitly by the pane poll, released on leaving -- and
// if the browser just dies, the server's sweeper restores the window once
// the polls stop. The desktop always gets its window back.
let fitted = null;              // pane we currently hold at phone size
let lastFit = null;             // size we asked for, to detect drift

const FIT_BASE = 12;            // px; the font the cell is measured at
function cellSize(){
  // Measure the real rendered cell, not a guess: 40 glyphs wide, two lines
  // tall, at the base font. Division averages away subpixel rounding.
  const out = $('#out');
  const probe = document.createElement('span');
  probe.textContent = '0'.repeat(40) + '\n' + '0'.repeat(40);
  probe.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;'
    + 'font:' + FIT_BASE + 'px/1.35 ' + getComputedStyle(out).fontFamily;
  out.appendChild(probe);
  const r = probe.getBoundingClientRect();
  probe.remove();
  return {w: r.width/40, h: r.height/2};
}
function fitBody(){
  // Exact content box, from the computed style rather than constants.
  const out = $('#out'), cs = getComputedStyle(out);
  const availW = out.clientWidth - parseFloat(cs.paddingLeft)
                                 - parseFloat(cs.paddingRight);
  const availH = out.clientHeight - parseFloat(cs.paddingTop)
                                  - parseFloat(cs.paddingBottom);
  const c = cellSize();
  const cols = Math.max(20, Math.floor(availW / c.w));
  // The floor leaves a sliver; scale the font so `cols` columns span the
  // width edge to edge instead. Glyph advances round per font size, so
  // scaling is not linear -- render a probe of exactly `cols` characters
  // and correct until it fits with less than one cell to spare.
  const probe = document.createElement('span');
  probe.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;'
    + 'line-height:1.35;font-family:' + cs.fontFamily;
  probe.textContent = '0'.repeat(cols) + '\n' + '0'.repeat(cols);
  out.appendChild(probe);
  let font = FIT_BASE * availW / (cols * c.w), lineH = c.h, w = availW;
  for(let i = 0; i < 4; i++){
    probe.style.fontSize = font.toFixed(2) + 'px';
    const r = probe.getBoundingClientRect();
    w = r.width; lineH = r.height / 2;
    if(w <= availW && availW - w < c.w) break;
    font = font * availW / w - (w > availW ? 0.02 : 0);
  }
  probe.remove();
  if(w > availW) font -= 0.1;          // never wider than the screen
  font = Math.min(FIT_BASE * 1.3, Math.max(FIT_BASE * 0.7, font));
  const rows = Math.max(8, Math.floor(availH / lineH));
  return {cols, rows, font: +font.toFixed(2)};
}
async function autoFit(){
  if(!sel || mode!=='term') return;
  if(fitted && fitted!==sel) releaseFit();
  const body = fitBody();
  try{
    const r = await fetch('/api/resize', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({pane: sel, auto: true,
                            cols: body.cols, rows: body.rows})});
    const d = await r.json();
    if(d.error) return msg(d.error, true);
    fitted = sel; lastFit = body;
    $('#out').style.fontSize = body.font + 'px';
    // The TUI needs a beat to repaint at the new size before we capture it.
    setTimeout(loadOut, 400);
  }catch(e){}
}
function releaseFit(){
  if(!fitted) return;
  // sendBeacon so the release survives navigation and tab close. If even
  // that is lost, the server lease expires and restores on its own.
  navigator.sendBeacon('/api/resize',
    new Blob([JSON.stringify({pane: fitted, release: true})],
             {type:'application/json'}));
  fitted = null; lastFit = null;
}
// Refit on rotation. Width is the tell: the on-screen keyboard only changes
// the height, and resizing tmux every time the composer opens would churn.
window.addEventListener('resize', ()=>{
  clearTimeout(window._fitT);
  window._fitT = setTimeout(()=>{
    if(mode==='term' && fitted && lastFit && fitBody().cols !== lastFit.cols)
      autoFit();
  }, 300);
});
// bfcache: pagehide releases the fit, pageshow on return re-acquires it.
window.addEventListener('pagehide', releaseFit);
window.addEventListener('pageshow', ()=>{ if(mode==='term') autoFit(); });

// ---- recording ------------------------------------------------------------
async function startRec(){
  let stream;
  try{
    stream = await navigator.mediaDevices.getUserMedia({audio:{
      channelCount:1, echoCancellation:true, noiseSuppression:true}});
  }catch(e){
    return msg('microphone blocked — needs https and permission', true);
  }
  chunks = [];
  // Keep a local handle: stop() is asynchronous, so onstop runs after
  // stopRec() has returned. Reading the recorder off a global that has since
  // been cleared throws inside the handler, and the clip is never sent.
  const mr = new MediaRecorder(stream);
  const mime = mr.mimeType || 'audio/webm';
  rec = mr;
  mr.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
  mr.onstop = async () => {
    stream.getTracks().forEach(t=>t.stop());
    rec = null;
    try{
      await sendClip(new Blob(chunks, {type: mime}));
    }catch(e){
      msg('failed: ' + e.message, true);
    }finally{
      idle();                       // never leave the button stuck
    }
  };
  mr.start();
  $('#talk').className = 'rec';
  $('#talklbl').textContent = 'stop';
  msg('recording…');
}

function idle(){
  busy = false;
  $('#talk').className = '';
  $('#talklbl').textContent = voiceOK ? 'talk' : 'voice off';
}

function stopRec(){
  if(rec && rec.state !== 'inactive') rec.stop();   // onstop does the rest
  $('#talk').className = 'busy';
  $('#talklbl').textContent = 'thinking…';
  busy = true;
}

async function sendClip(blob){
  if(!blob.size) return msg('no audio captured', true);
  const ext = (blob.type.includes('ogg')) ? 'ogg'
            : (blob.type.includes('mp4')) ? 'mp4' : 'webm';
  // Bound the wait: a request that never returns must not strand the UI.
  const ctl = new AbortController();
  const bail = setTimeout(()=>ctl.abort(), 90000);
  try{
    const r = await fetch(`/api/dictate?pane=${encodeURIComponent(sel||'')}&ext=${ext}`,
                          {method:'POST', body:blob, signal:ctl.signal});
    const d = await r.json();
    if(d.error){ msg(d.error, true); }
    else{
      $('#draft').value = d.final;
      $('#draft').classList.add('show');
      $('#actions').classList.add('show');
      msg(d.raw !== d.final ? 'cleaned up · review and send' : 'review and send');
    }
  }catch(e){
    msg(e.name === 'AbortError' ? 'timed out' : 'failed: ' + e.message, true);
  }finally{
    clearTimeout(bail);
  }
}

async function doSend(withEnter){
  const text = $('#draft').value.trim();
  if(!text || !sel) return;
  await fetch('/api/send', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({pane:sel, text, enter:!!withEnter})});
  clearDraft();
  msg(withEnter ? 'sent and submitted' : 'sent — not submitted');
  setTimeout(loadOut, 250);
}

function clearDraft(){
  $('#draft').value=''; $('#draft').classList.remove('show');
  $('#actions').classList.remove('show');
}

$('#talk').onclick = () => {
  if(busy) return;
  if(rec) stopRec(); else startRec();
};

// Enter and esc for the selected pane. Between these and the mic, most of
// working with an agent is confirming, backing out, or saying what you want.
async function sendKey(key){
  if(!sel) return msg('no pane selected', true);
  try{
    const r = await fetch('/api/answer', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({pane: sel, key})});
    const d = await r.json();
    if(d.error) return msg(d.error, true);
    msg('sent ' + (key === 'enter' ? '⏎' : key));
    // The pane view is the one that shows the effect, so refresh whichever
    // is on screen rather than waiting for the poll.
    setTimeout(()=>{ if(mode==='term') loadOut(); else if(mode==='ov') loadOverview(); }, 350);
  }catch(e){ msg('failed: '+e.message, true); }
}
$('#kEnter').onclick = ()=> sendKey('enter');
$('#kEsc').onclick   = ()=> sendKey('esc');
// Menu work is bursty: open the pad, pick the option, come back to talk.
// The pad swaps in for the whole talk row rather than stacking on top of it.
function setNav(on){
  $('#navpad').classList.toggle('show', on);
  $('#keysMain').classList.toggle('hide', on);
  $('#kNav').setAttribute('aria-expanded', String(on));
}
$('#kNav').onclick      = ()=> setNav(true);
$('#kNavClose').onclick = ()=> setNav(false);
document.querySelectorAll('#navpad [data-k]').forEach(b=>{
  b.onclick = ()=> sendKey(b.dataset.k);
});
// The same composer dictation lands in, opened empty -- sometimes you just
// want to type. Tapping again with nothing written closes it.
$('#kType').onclick  = ()=>{
  const d = $('#draft');
  if(d.classList.contains('show') && !d.value.trim()){
    clearDraft(); msg(''); return;
  }
  d.classList.add('show');
  $('#actions').classList.add('show');
  d.focus();
};
$('#send').onclick      = () => doSend(false);
$('#sendEnter').onclick = () => doSend(true);
$('#discard').onclick   = () => { clearDraft(); msg(''); };

$('#mOv').onclick   = ()=> setMode('ov');
$('#mTerm').onclick = ()=> setMode('term');
$('#mTx').onclick   = ()=> setMode('tx');
// Poll the overview only while it is on screen; it costs a transcript tail
// per agent pane, which is wasted work behind another view. Never mid-swipe:
// a redraw would yank the card out from under the finger.
setInterval(()=>{ if(mode==='ov' && !document.hidden && !swipeDrag) loadOverview(); }, 5000);
// Between full redraws, the cheap liveness check keeps the list honest:
// a session killed anywhere disappears within a couple of seconds.
setInterval(()=>{ if(mode==='ov' && !document.hidden && !swipeDrag) reconcileOv(); }, 2000);
// The prompt dock is one capture-pane per poll — cheap enough to keep the
// transcript view honest about a waiting prompt within a few seconds.
setInterval(()=>{ if(mode==='tx' && !document.hidden) pollPrompt(); }, 4000);
// A phone suspends background tabs and the stream dies quietly; reopen it on
// return rather than showing a frozen transcript.
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden) stopStream();
  else if(mode==='tx'){ startStream(); pollPrompt(); }
});

if(location.pathname==='/message'){
  loadFullMessage();
}else{
  loadKeys();
  updateFooter();
  loadPanes().then(loadSession);
  loadOverview();
  setMode('ov');          // open on the sessions list, not a single pane
  loadOut();
  setInterval(loadPanes, 10000);
  // Only poll the pane while it is the visible view.
  pollTimer = setInterval(()=>{ if(!busy && !rec && mode==='term') loadOut(); }, 2000);
  setInterval(()=>{ if(mode!=='tx') loadSession(); }, 15000);
}
document.addEventListener('visibilitychange', ()=>{
  // Coming back after a long lock, the sweeper may have restored the window
  // already; autoFit re-acquires rather than assuming the lease survived.
  // The sessions list redraws immediately too: it is the first thing on
  // screen after an unlock, and waiting out the poll tick would greet the
  // user with whatever was true before the phone went to sleep.
  if(!document.hidden){
    loadPanes();
    if(mode==='ov') loadOverview();
    if(mode==='term'){ autoFit(); loadOut(); }
  }
});
</script>
</body>
