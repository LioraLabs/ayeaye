<title>cliban board</title>
<style>
  :root{
    --bg0:#16161e; --bg1:#1a1b26;
    --panel:#24273a; --panel2:#1e2030; --well:#181926;
    --line:#2c2f44; --line2:#3b3f58;
    --fg:#cad3f5; --muted:#8087a2; --faint:#5b6078;
    --green:#a6da95; --orange:#f5a97f; --yellow:#eed49f;
    --red:#ed8796; --blue:#8aadf4;
    --r-s:8px; --r-m:12px; --r-l:16px;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,
           "Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,
           "Liberation Mono",monospace;
    --ease:cubic-bezier(.3,.7,.4,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  #board,#tbody{scrollbar-width:none}
  #board::-webkit-scrollbar,#tbody::-webkit-scrollbar{display:none}
  body{
    margin:0;color:var(--fg);
    background:linear-gradient(180deg,var(--bg1) 0%,var(--bg0) 45%) fixed var(--bg0);
    font:15px/1.5 var(--sans);
    display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right)
            env(safe-area-inset-bottom) env(safe-area-inset-left);
    overscroll-behavior:none;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;cursor:pointer}
  button:active{transform:scale(.97)}
  button{transition:background .15s var(--ease),border-color .15s var(--ease),
                    color .15s var(--ease),transform .1s var(--ease)}

  /* ---- header ------------------------------------------------------------ */
  header{
    display:flex;align-items:center;gap:10px;padding:10px 14px;flex:none;
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:8px;min-width:0}
  .brand svg{flex:none;display:block;opacity:.92}
  .brand b{font-size:15px;font-weight:650;letter-spacing:.01em;white-space:nowrap}
  .spacer{flex:1}
  .hbtn{
    display:inline-flex;align-items:center;gap:6px;min-height:34px;
    padding:6px 12px;border:1px solid var(--line);border-radius:10px;
    background:var(--panel2);color:var(--muted);font-size:12px;font-weight:550;
    cursor:pointer;text-decoration:none;line-height:1.3;
  }
  .hbtn:active{background:var(--line)}
  .seg{
    display:flex;flex:none;background:var(--panel2);border:1px solid var(--line);
    border-radius:10px;padding:2px;gap:2px;
  }
  .seg a{
    padding:5px 12px;border-radius:8px;font-size:12px;font-weight:550;
    color:var(--muted);text-decoration:none;line-height:1.3;
    transition:background .15s var(--ease),color .15s var(--ease);
  }
  .seg a.on{background:var(--panel);color:var(--fg);
            box-shadow:0 1px 3px rgba(0,0,0,.35)}

  /* ---- project chips ----------------------------------------------------- */
  #projrow{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;flex:none;
           scrollbar-width:none}
  #projrow::-webkit-scrollbar{display:none}
  .chip{
    flex:none;padding:7px 12px;border:1px solid var(--line);
    border-radius:999px;background:var(--panel2);color:var(--muted);
    font-size:12.5px;font-weight:550;white-space:nowrap;cursor:pointer;
    transition:border-color .15s var(--ease),color .15s var(--ease),
               background .15s var(--ease);
  }
  .chip.sel{border-color:var(--line2);background:var(--panel);color:var(--fg)}
  .chip small{color:var(--faint);margin-left:6px;font-size:11px;
              font-family:var(--mono)}
  .chip.sel small{color:var(--muted)}

  /* ---- board ------------------------------------------------------------- */
  #board{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 14px 48px;
         -webkit-overflow-scrolling:touch}
  .sect{display:flex;align-items:center;gap:8px;margin:18px 2px 8px;
        color:var(--muted);font-size:11px;font-weight:650;
        letter-spacing:.08em;text-transform:uppercase}
  .sect:first-child{margin-top:8px}
  .sect .n{color:var(--faint);font-weight:550}
  .sect button{
    margin-left:auto;padding:4px 11px;min-height:28px;
    border:1px solid var(--line);border-radius:999px;background:transparent;
    color:var(--muted);font-size:11px;font-weight:550;
    letter-spacing:0;text-transform:none;
  }
  .sect button.on{border-color:rgba(138,173,244,.4);color:var(--blue);
                  background:rgba(138,173,244,.08)}
  .note{color:var(--faint);font-size:12.5px;margin:10px 2px}

  /* milestones */
  .ms{
    border:1px solid var(--line);border-radius:var(--r-m);
    background:var(--panel2);padding:10px 12px;margin:8px 0;cursor:pointer;
    transition:border-color .15s var(--ease);
  }
  .ms.sel{border-color:rgba(138,173,244,.5)}
  .ms .top{display:flex;align-items:center;gap:8px;min-width:0}
  .ms .name{font-size:13.5px;font-weight:600;white-space:nowrap;
            overflow:hidden;text-overflow:ellipsis}
  .ms .meta{margin-left:auto;flex:none;color:var(--faint);font-size:11px;
            white-space:nowrap}
  .ms .bar{height:4px;background:var(--well);border-radius:2px;margin-top:8px;
           overflow:hidden}
  .ms .bar i{display:block;height:100%;background:var(--green);
             border-radius:2px;transition:width .3s var(--ease)}
  .ms.closed .name{color:var(--muted);font-weight:500}

  /* kanban columns: horizontal snap scroll on a phone */
  .cols{
    display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;
    scroll-snap-type:x mandatory;margin:4px -14px 0;padding:4px 14px 14px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .cols::-webkit-scrollbar{display:none}
  .col{
    flex:0 0 min(80vw,320px);scroll-snap-align:start;align-self:flex-start;
    background:var(--panel2);border:1px solid var(--line);
    border-radius:var(--r-l);padding:10px 10px 8px;
  }
  .colhead{display:flex;align-items:center;gap:8px;padding:2px 4px 8px}
  .colhead .n{margin-left:auto;color:var(--faint);font-size:11px;
              font-family:var(--mono)}

  .st{
    display:inline-flex;align-items:center;gap:6px;
    font-size:11px;font-weight:600;letter-spacing:.02em;
    padding:3px 10px 3px 8px;border-radius:999px;
    border:1px solid var(--line);color:var(--muted);
  }
  .st i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
  .st.in-progress{color:var(--green);border-color:rgba(166,218,149,.25);
                  background:rgba(166,218,149,.07)}
  .st.blocked{color:var(--orange);border-color:rgba(245,169,127,.35);
              background:rgba(245,169,127,.1)}
  .st.in-review{color:var(--blue);border-color:rgba(138,173,244,.28);
                background:rgba(138,173,244,.08)}
  .st.done{color:var(--green);border-color:rgba(166,218,149,.2)}
  .st.backlog{color:var(--faint)}

  /* ticket cards: priority as a colored left accent, cliban TUI colors */
  .iss{
    position:relative;border:1px solid var(--line);border-radius:var(--r-m);
    background:var(--panel);padding:9px 11px 9px 14px;margin:6px 0;
    cursor:pointer;overflow:hidden;
    transition:border-color .15s var(--ease);
  }
  .iss::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
               background:var(--line2)}
  .iss.p-urgent::before{background:var(--red)}
  .iss.p-high::before{background:var(--orange)}
  .iss.p-medium::before{background:var(--yellow)}
  .iss.p-low::before{background:var(--blue)}
  .iss:active{border-color:var(--line2)}
  .iss .key{font:10.5px var(--mono);color:var(--faint)}
  .iss .title{font-size:13px;line-height:1.4;margin-top:2px;
              overflow-wrap:anywhere}
  .iss.done .title{color:var(--muted)}
  .iss .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
  .badge{
    font-size:10px;font-weight:600;letter-spacing:.03em;
    padding:2px 7px;border-radius:999px;
    border:1px solid var(--line2);color:var(--muted);background:var(--well);
    white-space:nowrap;
  }
  .pri{
    font-size:10px;font-weight:650;letter-spacing:.05em;
    text-transform:uppercase;padding:2px 7px;border-radius:999px;
    border:1px solid var(--line2);color:var(--muted);white-space:nowrap;
  }
  .pri.urgent{color:var(--red);border-color:rgba(237,135,150,.4);
              background:rgba(237,135,150,.1)}
  .pri.high{color:var(--orange);border-color:rgba(245,169,127,.4);
            background:rgba(245,169,127,.1)}
  .pri.medium{color:var(--yellow);border-color:rgba(238,212,159,.35);
              background:rgba(238,212,159,.08)}
  .pri.low{color:var(--blue);border-color:rgba(138,173,244,.35);
           background:rgba(138,173,244,.08)}

  /* ---- ticket overlay ---------------------------------------------------- */
  #ticket{
    position:fixed;inset:0;display:none;flex-direction:column;
    background:linear-gradient(180deg,var(--bg1) 0%,var(--bg0) 45%) fixed var(--bg0);
    padding:env(safe-area-inset-top) env(safe-area-inset-right)
            env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #ticket.show{display:flex}
  #thead{display:flex;align-items:center;gap:10px;padding:10px 14px;
         border-bottom:1px solid var(--line);flex:none}
  #trun{border-color:rgba(166,218,149,.45);color:var(--green);
        background:rgba(166,218,149,.08);font-weight:600}
  #tbody{flex:1;overflow:auto;padding:14px 14px 48px;
         -webkit-overflow-scrolling:touch;overflow-wrap:anywhere}
  #tbody .keyline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  #tbody .key{color:var(--faint);font:12px var(--mono)}
  #tbody h1.title{font-size:17px;font-weight:650;margin:10px 0 4px;
                  line-height:1.35}
  .rel{color:var(--blue);cursor:pointer;font-family:var(--mono);font-size:12px}
  .metarow{color:var(--muted);font-size:12px;margin:3px 0}
  #tmsg{font-size:12.5px;color:var(--muted);min-height:1.2em;margin:8px 0}
  #tmsg.err{color:var(--red)}
  #tmsg a{color:var(--green)}

  /* run picker (mirrors the main page's new-agent flow) */
  #runbox{display:none;border:1px solid var(--line);border-radius:var(--r-l);
          background:var(--panel2);padding:12px;margin:10px 0}
  #runbox.show{display:block}
  #agents{display:flex;gap:8px;margin-bottom:10px}
  #agents button{
    flex:1;min-height:44px;padding:9px;border:1px solid var(--line);
    border-radius:var(--r-m);background:var(--well);color:var(--muted);
    font-size:13px;font-weight:550;
  }
  #agents button.sel{border-color:rgba(166,218,149,.45);color:var(--green);
                     background:rgba(166,218,149,.08)}
  #rq{
    width:100%;min-height:44px;padding:10px 14px;margin-bottom:6px;
    border:1px solid var(--line2);border-radius:var(--r-m);
    background:var(--well);color:var(--fg);font:14px var(--sans);outline:none;
    transition:border-color .15s var(--ease);
  }
  #rq:focus{border-color:var(--blue)}
  #rq::placeholder{color:var(--faint)}
  .proj{
    min-height:44px;padding:10px 4px;border-bottom:1px solid var(--line);
    cursor:pointer;display:flex;align-items:center;gap:10px;
  }
  .proj:last-child{border-bottom:0}
  .proj .p{font-size:13.5px}
  .proj .s{margin-left:auto;font:11px var(--mono);color:var(--faint);
           white-space:nowrap}

  /* ---- rendered markdown ------------------------------------------------- */
  .mdb{font-size:13.5px;line-height:1.6;margin-top:14px}
  .mdb h1,.mdb h2,.mdb h3,.mdb h4,.mdb h5,.mdb h6{
    margin:1.15em 0 .35em;line-height:1.3;font-weight:650}
  .mdb h1{font-size:15.5px}
  .mdb h2{font-size:14.5px;border-bottom:1px solid var(--line);
          padding-bottom:.3em;color:var(--green)}
  .mdb h3{font-size:14px;color:var(--blue)}
  .mdb h4,.mdb h5,.mdb h6{font-size:13.5px;color:var(--muted)}
  .mdb p{margin:.55em 0;white-space:pre-wrap}
  .mdb code{background:var(--well);border:1px solid var(--line);
            border-radius:5px;padding:0 .3em;
            font:.92em var(--mono)}
  .mdb pre{background:var(--well);border:1px solid var(--line);
           border-radius:var(--r-m);padding:10px 12px;overflow-x:auto;
           font:12px/1.5 var(--mono);margin:.7em 0}
  .mdb pre code{background:none;border:0;padding:0;font:inherit;
                white-space:pre}
  .mdb ul,.mdb ol{margin:.5em 0;padding-left:1.4em}
  .mdb li{margin:.25em 0}
  .mdb blockquote{border-left:3px solid var(--line2);margin:.6em 0;
                  padding:.05em .9em;color:var(--muted)}
  .mdb hr{border:0;border-top:1px solid var(--line);margin:1.1em 0}
  .mdb a{color:var(--blue)}
  .mdb table{border-collapse:collapse;font-size:12.5px;display:block;
             overflow-x:auto;margin:.7em 0;max-width:100%}
  .mdb th,.mdb td{border:1px solid var(--line);padding:.3rem .6rem;
                  text-align:left;vertical-align:top}
  .mdb th{color:var(--muted);background:var(--panel2)}
  .cb{color:var(--faint)}
  .cb.x{color:var(--green)}
</style>
</head>
<body>

<header>
  <span class="brand">

    <b>cliban</b>
  </span>
  <span class="spacer"></span>
  <button class="hbtn" id="refresh">↻ refresh</button>
  <nav class="seg">
    <a href="/">remote</a>
    <a class="on" href="/board">board</a>
  </nav>
</header>

<div id="projrow"></div>
<div id="board"><div class="note">loading…</div></div>

<div id="ticket">
  <div id="thead">
    <button class="hbtn" id="tback">← back</button>
    <span class="spacer"></span>
    <button class="hbtn" id="trun">▶ run</button>
  </div>
  <div id="tbody"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const KEY_RE = /^[A-Za-z][A-Za-z0-9]*-\d+$/;
let data = null, loadedAt = 0;
let proj = localStorage.clibanProj || 'all';
let msSel = null;                 // {project, name} milestone filter
let showClosedMs = false, showAllDone = false;
let ticket = null, agent = 'claude';

const projOf = key => key.split('-')[0];
const escH = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;')
                   .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// Ticket keys inside rendered markdown become links to their tickets --
// specs reference each other constantly. Runs over finished HTML, skipping
// existing anchors (a markdown link whose label is a key stays one link).
let KEYS_RE = null;
function linkKeys(html){
  if(!KEYS_RE) return html;
  let inA = 0;
  return html.split(/(<[^>]*>)/).map(seg=>{
    if(seg[0] === '<'){
      if(/^<a[\s>]/i.test(seg)) inA++;
      else if(/^<\/a>/i.test(seg)) inA = Math.max(0, inA-1);
      return seg;
    }
    return inA ? seg
               : seg.replace(KEYS_RE, m=>'<a href="#'+m+'">'+m+'</a>');
  }).join('');
}

// ---- markdown --------------------------------------------------------------
// A deliberately small renderer: headings, fences, lists (with checkboxes),
// quotes, tables, rules, bold/italic/code/links. Everything is HTML-escaped
// before any markup is added -- ticket bodies are agent-written and full of
// angle brackets.
function inline(s){
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (m,c)=>{
    codes.push(c); return '\x00' + (codes.length-1) + '\x00'; });
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
       .replace(/(^|\W)\*([^*\s][^*]*)\*/g, '$1<i>$2</i>')
       .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
                '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s.replace(/\x00(\d+)\x00/g, (m,i)=>'<code>'+codes[i]+'</code>');
}

function md(src){
  const lines = src.replace(/\r/g,'').split('\n');
  const out = [];
  let i = 0;
  while(i < lines.length){
    const l = lines[i];
    let m;
    if(/^```/.test(l)){
      const buf = []; i++;
      while(i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out.push('<pre><code>'+escH(buf.join('\n'))+'</code></pre>');
      continue;
    }
    if((m = /^(#{1,6})\s+(.*)$/.exec(l))){
      const n = m[1].length;
      out.push('<h'+n+'>'+inline(escH(m[2]))+'</h'+n+'>'); i++; continue;
    }
    if(/^\s*(---+|\*\*\*+|___+)\s*$/.test(l)){ out.push('<hr>'); i++; continue; }
    if(/^\s*([-*+]|\d+\.)\s+/.test(l)){
      const ordered = /^\s*\d+\./.test(l);
      const items = [];
      while(i < lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])){
        let t = lines[i].replace(/^\s*([-*+]|\d+\.)\s+/,'');
        let cb = '';
        const c = /^\[( |x|X)\]\s+(.*)$/.exec(t);
        if(c){
          cb = c[1].trim() ? '<span class="cb x">☑ </span>'
                           : '<span class="cb">☐ </span>';
          t = c[2];
        }
        items.push('<li>'+cb+inline(escH(t))+'</li>'); i++;
      }
      out.push((ordered?'<ol>':'<ul>')+items.join('')+(ordered?'</ol>':'</ul>'));
      continue;
    }
    if(/^\s*>\s?/.test(l)){
      const buf = [];
      while(i < lines.length && /^\s*>\s?/.test(lines[i]))
        buf.push(lines[i++].replace(/^\s*>\s?/,''));
      out.push('<blockquote>'+md(buf.join('\n'))+'</blockquote>');
      continue;
    }
    if(/^\s*\|.*\|\s*$/.test(l) && i+1 < lines.length &&
       /^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){
      const cells = r => r.trim().replace(/^\||\|$/g,'').split('|')
                          .map(c=>inline(escH(c.trim())));
      const head = cells(l); i += 2;
      const rows = [];
      while(i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i]))
        rows.push(cells(lines[i++]));
      out.push('<table><thead><tr>'+
        head.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>'+
        rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+
        '</tbody></table>');
      continue;
    }
    if(!l.trim()){ i++; continue; }
    const buf = [l]; i++;
    while(i < lines.length && lines[i].trim() &&
          !/^(#{1,6}\s|```|\s*([-*+]|\d+\.)\s|\s*>|\s*\|.*\|\s*$)/.test(lines[i]))
      buf.push(lines[i++]);
    out.push('<p>'+inline(escH(buf.join('\n')))+'</p>');
  }
  return out.join('\n');
}

// ---- board -----------------------------------------------------------------
async function load(){
  try{
    const d = await (await fetch('/api/cliban/board')).json();
    if(d.error){ $('#board').innerHTML =
      '<div class="note">'+escH(d.error)+'</div>'; return; }
    data = d; loadedAt = Date.now();
    KEYS_RE = d.projects.length
      ? new RegExp('\\b(?:'+d.projects.map(p=>p.key).join('|')+')-\\d+\\b','g')
      : null;
    render();
  }catch(e){
    $('#board').innerHTML = '<div class="note">cannot reach the server</div>';
  }
}

function render(){
  if(!data) return;
  renderChips();
  const box = $('#board'); box.innerHTML = '';
  renderMilestones(box);
  renderIssues(box);
}

function renderChips(){
  const row = $('#projrow'); row.innerHTML = '';
  const open = {};
  data.issues.forEach(x=>{
    if(x.status !== 'done')
      open[projOf(x.key)] = (open[projOf(x.key)]||0)+1;
  });
  const mk = (key, label, count)=>{
    const el = document.createElement('div');
    el.className = 'chip' + (proj===key?' sel':'');
    el.innerHTML = escH(label) +
      (count ? '<small>'+count+'</small>' : '');
    el.onclick = ()=>{
      proj = key; localStorage.clibanProj = key; msSel = null;
      showAllDone = false; render();
    };
    row.appendChild(el);
  };
  mk('all', 'all', data.issues.filter(x=>x.status!=='done').length);
  data.projects.forEach(p=> mk(p.key, p.key, open[p.key]||0));
}

const inProj = key => proj==='all' || projOf(key)===proj;

function renderMilestones(box){
  let ms = data.milestones.filter(m=> proj==='all' || m.project===proj);
  const closed = ms.filter(m=> m.status!=='open').length;
  if(!showClosedMs) ms = ms.filter(m=> m.status==='open');
  if(!ms.length && !closed) return;

  const head = document.createElement('div');
  head.className = 'sect';
  head.innerHTML = 'milestones <span class="n">· '+ms.length+'</span>';
  if(closed){
    const b = document.createElement('button');
    b.textContent = showClosedMs ? 'hide closed' : 'closed · '+closed;
    b.className = showClosedMs ? 'on' : '';
    b.onclick = ()=>{ showClosedMs = !showClosedMs; render(); };
    head.appendChild(b);
  }
  box.appendChild(head);

  ms.forEach(m=>{
    const mine = data.issues.filter(x=>
      x.milestone===m.name && projOf(x.key)===m.project);
    const done = mine.filter(x=> x.status==='done').length;
    const total = mine.length || m.issue_count || 0;
    const sel = msSel && msSel.name===m.name && msSel.project===m.project;
    const el = document.createElement('div');
    el.className = 'ms' + (sel?' sel':'') + (m.status!=='open'?' closed':'');
    const bits = [];
    if(proj==='all') bits.push(m.project);
    if(m.status!=='open') bits.push(m.status);
    bits.push(done+'/'+total);
    if(m.target_date) bits.push('→ '+m.target_date);
    el.innerHTML =
      '<div class="top"><span class="name"></span>'+
      '<span class="meta">'+escH(bits.join(' · '))+'</span></div>'+
      '<div class="bar"><i style="width:'+
        (total ? Math.round(100*done/total) : 0)+'%"></i></div>';
    el.querySelector('.name').textContent = m.name;
    el.onclick = ()=>{
      msSel = sel ? null : {project:m.project, name:m.name};
      render();
      // jump to the issue list, which is what filtering is for
      if(!sel) $('#isshead').scrollIntoView({behavior:'smooth'});
    };
    box.appendChild(el);
  });
}

const STATUSES = [
  ['blocked','blocked'], ['in-progress','in progress'],
  ['in-review','in review'], ['backlog','backlog'], ['done','done'],
];

function issueRow(x){
  const el = document.createElement('div');
  el.className = 'iss p-'+escH(x.priority||'none') +
                 (x.status==='done'?' done':'');
  const tags = [];
  if(x.priority && x.priority!=='none')
    tags.push('<span class="pri '+escH(x.priority)+'">'+
              escH(x.priority)+'</span>');
  (x.labels||[]).slice(0,2).forEach(l=>
    tags.push('<span class="badge">'+escH(l)+'</span>'));
  if(x.milestone && !msSel)
    tags.push('<span class="badge">'+escH(x.milestone)+'</span>');
  el.innerHTML = '<div class="key">'+escH(x.key)+'</div>'+
    '<div class="title"></div>'+
    (tags.length ? '<div class="tags">'+tags.join('')+'</div>' : '');
  el.querySelector('.title').textContent = x.title;
  el.onclick = ()=>{ location.hash = x.key; };
  return el;
}

function renderIssues(box){
  let iss = data.issues.filter(x=> inProj(x.key));
  if(msSel) iss = iss.filter(x=>
    x.milestone===msSel.name && projOf(x.key)===msSel.project);

  const head = document.createElement('div');
  head.className = 'sect'; head.id = 'isshead';
  head.innerHTML = 'issues <span class="n">· '+iss.length+'</span>';
  if(msSel){
    const b = document.createElement('button');
    b.className = 'on';
    b.textContent = msSel.name+' ×';
    b.onclick = ()=>{ msSel = null; render(); };
    head.appendChild(b);
  }
  box.appendChild(head);

  // Kanban: one snap-scrollable column per status with issues in it.
  const cols = document.createElement('div');
  cols.className = 'cols';
  STATUSES.forEach(([st, label])=>{
    let group = iss.filter(x=> x.status===st);
    if(!group.length) return;
    const col = document.createElement('div');
    col.className = 'col';
    const h = document.createElement('div');
    h.className = 'colhead';
    h.innerHTML = '<span class="st '+st+'"><i></i>'+label+'</span>'+
                  '<span class="n">'+group.length+'</span>';
    col.appendChild(h);
    if(st==='done' && !showAllDone && group.length > 15){
      group = group.slice()
        .sort((a,b)=> (b.completed_at||'').localeCompare(a.completed_at||''))
        .slice(0,15);
    }
    group.forEach(x=> col.appendChild(issueRow(x)));
    if(st==='done' && !showAllDone &&
       iss.filter(x=>x.status==='done').length > 15){
      const b = document.createElement('div');
      b.className = 'note'; b.style.cursor = 'pointer';
      b.textContent = '… show all '+iss.filter(x=>x.status==='done').length+
                      ' done';
      b.onclick = ()=>{ showAllDone = true; render(); };
      col.appendChild(b);
    }
    cols.appendChild(col);
  });
  if(cols.children.length) box.appendChild(cols);
  if(!iss.length){
    const n = document.createElement('div');
    n.className = 'note'; n.textContent = 'no issues here';
    box.appendChild(n);
  }
}

// ---- ticket ----------------------------------------------------------------
function tmsg(t, err, html){
  const m = $('#tmsg'); if(!m) return;
  if(html) m.innerHTML = t; else m.textContent = t||'';
  m.className = err ? 'err' : '';
}

async function showTicket(key){
  $('#ticket').classList.add('show');
  $('#tbody').innerHTML = '<div class="note">loading '+escH(key)+'…</div>';
  ticket = null;
  let d;
  try{ d = await (await fetch('/api/cliban/issue?key='+
                              encodeURIComponent(key))).json(); }
  catch(e){ d = {error: e.message}; }
  if(d.error){
    $('#tbody').innerHTML = '<div class="note">'+escH(d.error)+'</div>';
    return;
  }
  ticket = d;
  const b = $('#tbody');
  const meta = [];
  if(d.milestone) meta.push('milestone: '+d.milestone);
  if(d.due_date) meta.push('due: '+d.due_date);
  if((d.labels||[]).length) meta.push('labels: '+d.labels.join(', '));
  if(d.git_branch_name) meta.push('branch: '+d.git_branch_name);
  b.innerHTML =
    '<div class="keyline"><span class="key">'+escH(d.key)+'</span>'+
    '<span class="st '+escH(d.status)+'"><i></i>'+escH(d.status)+'</span>'+
    (d.priority!=='none'
      ? '<span class="pri '+escH(d.priority)+'">'+escH(d.priority)+'</span>' : '')+
    '</div>'+
    '<h1 class="title"></h1>'+
    meta.map(t=>'<div class="metarow">'+escH(t)+'</div>').join('')+
    ((d.relations||[]).length
      ? '<div class="metarow">'+d.relations.map(r=>
          escH(r.type)+' <span class="rel" data-k="'+escH(r.target)+'">'+
          escH(r.target)+'</span>').join(' · ')+'</div>'
      : '')+
    '<div id="tmsg"></div>'+
    '<div id="runbox">'+
      '<div id="agents">'+
        '<button data-a="claude" class="sel">claude</button>'+
        '<button data-a="codex">codex</button>'+
      '</div>'+
      '<input id="rq" placeholder="project directory…" autocomplete="off" '+
        'spellcheck="false">'+
      '<div id="rlist"></div>'+
    '</div>'+
    '<div class="mdb">'+
      (d.description ? linkKeys(md(d.description))
                     : '<p style="color:var(--faint)">no description</p>')+
    '</div>';
  b.querySelector('h1.title').textContent = d.title;
  b.querySelectorAll('.rel').forEach(el=>
    el.onclick = ()=>{ location.hash = el.dataset.k; });
  b.querySelectorAll('#agents button').forEach(el=>
    el.onclick = ()=>{
      agent = el.dataset.a;
      b.querySelectorAll('#agents button').forEach(x=>
        x.classList.toggle('sel', x===el));
    });
  $('#rq').addEventListener('input', ()=>{
    clearTimeout(window._rqT);
    window._rqT = setTimeout(loadRunDirs, 150);
  });
  b.scrollTop = 0;
}

function hideTicket(){
  $('#ticket').classList.remove('show');
  ticket = null;
}

// ---- run it ----------------------------------------------------------------
// Spawning reuses the main page's flow: pick a directory from zoxide, the
// server derives the tmux session. The only addition is an opening prompt
// pointing the agent at this ticket.
function runPrompt(t){
  let p = 'Work on cliban issue '+t.key+': "'+t.title+'". '+
    'Run `cliban issue show '+t.key+'` for the full spec and plan. '+
    'Keep the ticket updated as you work: log progress with '+
    '`cliban issue log '+t.key+' "<note>"`, tick finished plan steps with '+
    '`cliban issue tick '+t.key+' <step>`, and move it with '+
    '`cliban issue mv '+t.key+' <status>` as its status changes.';
  if(t.git_branch_name)
    p += ' If you work on a branch, name it '+t.git_branch_name+'.';
  return p;
}

async function loadRunDirs(){
  const q = $('#rq').value.trim();
  let d;
  try{ d = await (await fetch('/api/projects?q='+
                              encodeURIComponent(q))).json(); }
  catch(e){ return; }
  const box = $('#rlist'); box.innerHTML = '';
  d.projects.forEach(p=>{
    const el = document.createElement('div');
    el.className = 'proj';
    el.innerHTML = '<span class="p"></span><span class="s">'+
      (p.exists ? '↳ '+escH(p.session) : escH(p.session))+'</span>';
    el.querySelector('.p').textContent = p.short;
    el.onclick = ()=> runTicket(p);
    box.appendChild(el);
  });
  if(!d.projects.length) box.textContent = 'nothing matching';
}

async function runTicket(p){
  if(!ticket) return;
  tmsg('starting '+agent+' in '+p.session+'…');
  try{
    const r = await fetch('/api/spawn', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({dir:p.dir, agent, prompt: runPrompt(ticket)})});
    const d = await r.json();
    if(d.error) return tmsg(d.error, true);
    $('#runbox').classList.remove('show');
    $('#trun').textContent = '▶ run';
    tmsg(escH(agent+' is on '+ticket.key+' · new '+d.created+' in '+
              d.session+' · ')+'<a href="/">open remote →</a>', false, true);
  }catch(e){ tmsg('spawn failed: '+e.message, true); }
}

$('#trun').onclick = ()=>{
  const box = $('#runbox'); if(!box || !ticket) return;
  const on = box.classList.toggle('show');
  $('#trun').textContent = on ? '× cancel' : '▶ run';
  if(on){ $('#rq').value = ''; loadRunDirs(); }
};
$('#tback').onclick = ()=>{
  if(location.hash) history.back(); else hideTicket();
};

// The phone back button should close a ticket, so tickets live in the hash.
function route(){
  const key = location.hash.replace(/^#/,'');
  if(KEY_RE.test(key)) showTicket(key); else hideTicket();
}
window.addEventListener('hashchange', route);

$('#refresh').onclick = ()=>{ $('#refresh').textContent = '…'; load()
  .then(()=> $('#refresh').textContent = '↻ refresh'); };
document.addEventListener('visibilitychange', ()=>{
  // Stale after a pocket trip; a board does not need live polling.
  if(!document.hidden && Date.now()-loadedAt > 60000) load();
});

load().then(route);
</script>
</body>
</html>
